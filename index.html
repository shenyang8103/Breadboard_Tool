<!doctype html>
<!--
ProtoboardMaster 离线版维护索引
1. 本文件由 workbench/package.cjs 生成；维护时修改源码再打包，不直接改生成物。
2. workbench/dist/：顶层容器、单 iframe 切换、状态通知和顶层下载；bridge.js 仅在统一构建中注入子工具。
3. preview/dist/：面包板 model（几何/铜片/图遍历）、editor（规则/兼容）、draft、export、files、app（交互）。
4. perfboard/dist/：洞洞板 model（物理孔/双面图）、editor（冻结布局/计划/一步历史）、files、draft、export、demo、app。
5. 各 JS 模块顶部说明依赖与重要变量；函数前说明用途与边界，图遍历、镜像、焊锡清理、裁板、冲突及保存均有算法注释。
6. editor-sources 为两套完整 HTML 的 JSON 字符串；换行/小于号转义属于容器编码，JSON.parse 后 srcdoc 保留原注释。
7. 正反面共用物理孔号；镜像不改网络。候选/选择/撤销/句柄不写工程，宿主不保存第二套活动状态。
8. 构建：node preview/package.cjs；node perfboard/package.cjs；node workbench/package.cjs。
9. 维护流程、字段与模块说明见 workbench/维护指南.md；用户说明见 README.md / README.en.md。
-->

ns:188px minmax(300px,1fr) 220px}.left-panel{padding:18px 12px}.tool{gap:6px;padding:8px 5px;font-size:11px;min-width:0}.tool-symbol{width:18px;flex-shrink:0}.right-panel{padding:18px 14px}.column-guide{gap:3px;font-size:10px}.column-guide>span{padding:6px 3px}.status-bar>span:last-child{display:none}}\n@media(max-width:850px){.project-title{display:none}.header-actions{margin-left:auto}.app-layout{grid-template-columns:175px minmax(300px,1fr)}.compact-inspector{display:block;padding:9px 12px;background:#f4f8f1;color:#48715a;font-size:11px;border-bottom:1px solid var(--border)}.right-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.number-guide,.rail-guide{border:0;padding:0;margin:0}.canvas{min-height:650px}}\n@media(max-width:540px){.app-header{flex-wrap:wrap}.header-actions{gap:5px}.brand strong{font-size:14px}.brand-mark{width:32px;height:32px;font-size:27px;line-height:30px}.header-actions button{font-size:10px;padding:6px}.header-actions button:disabled{display:none}.app-layout{display:flex;flex-direction:column}.left-panel{border-right:0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:16px}.left-panel>section:first-child{order:2}.tool-grid{grid-template-columns:repeat(3,1fr)}.wide-tool{grid-column:auto}.tool-hint{min-height:0}.board-settings{padding:0;margin:0;border:0;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.board-settings .section-heading{grid-column:1/-1}.board-settings .field-label{margin:0 0 6px}.board-settings select,.board-settings .segmented{margin-bottom:13px}.board-settings .field-label:nth-of-type(2){grid-row:2;grid-column:2}.board-settings .segmented{grid-row:3;grid-column:2}.board-settings .field-label[for=rails]{grid-row:4;grid-column:1}.board-settings #rails{grid-row:5;grid-column:1}.board-settings .field-label[for=rail-mode]{grid-row:4;grid-column:2}.board-settings #rail-mode{grid-row:5;grid-column:2}.setting-detail,.checkbox-label{grid-column:1/-1}.setting-detail{min-height:0}.scope-note{margin:0;padding-top:12px;order:3}.scope-note p{margin:2px 0}.canvas{min-height:650px}.canvas-toolbar{padding:10px}.canvas-toolbar strong{font-size:10px}.view-actions{gap:4px!important}.connection-strip{gap:12px;padding:10px}.legend-note{display:none}.right-panel{display:flex;flex-direction:column}.number-guide,.rail-guide{border-top:1px solid var(--border);padding-top:18px}.column-guide{justify-content:flex-start}.status-bar{font-size:10px}}\n@media(min-width:851px){.app-layout{height:calc(100dvh - 76px);min-height:0}.left-panel,.right-panel{overflow-y:auto;min-height:0}.workspace{min-height:0}.canvas{min-height:0}.canvas-toolbar,.frame-panel,.compact-inspector,.connection-strip,.status-bar{flex-shrink:0}.frame-panel{max-height:42vh;overflow-y:auto}}\n\n.property-form .pin-list{margin-top:0;gap:7px}.property-form .pin-list>div{align-items:center;gap:7px}.property-form .pin-list label{display:flex;align-items:center;gap:5px;min-width:0;flex:1;white-space:nowrap}.property-form .pin-list input{width:62px;max-width:100%;padding:5px 6px}.property-form .pin-list span{font-size:10px}\n.board-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.board-actions button{font-size:11px;padding:7px 4px}[data-board-select]{cursor:pointer}.board-actions button:disabled{opacity:.45}\n.board-selection{font-size:11px;padding:9px;background:#f1f7f2;border:1px solid var(--border);border-radius:6px;grid-column:1/-1}.canvas.part-dragging,.canvas.part-dragging *{cursor:grabbing!important}\n[data-draggable] .part-body{cursor:grab}\n#diode-options>.toggle-button,#chip-options>.toggle-button,#transistor-options>.toggle-button{display:block;width:100%;margin-top:12px}\n.canvas.board-dragging,.canvas.board-dragging *{cursor:grabbing!important}[data-board-layer][data-board-picked]{cursor:grab}\n.canvas.selecting,.canvas.selecting *{cursor:crosshair!important}\n\n.save-split{display:flex;position:relative}.save-split>#save-project{border-top-right-radius:0;border-bottom-right-radius:0}.save-split>#save-menu-toggle{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:#ffffff55;padding-inline:8px}#save-menu{position:absolute;z-index:20;right:0;top:calc(100% + 5px);min-width:130px;padding:5px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 5px 18px #24353422}#save-menu[hidden]{display:none}#save-menu button{width:100%;text-align:left;border:0}.save-field{display:grid;gap:7px;margin-top:16px;color:#526e61;font-size:12px}.save-field input{width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;color:#243534;background:#fff}.save-field small{font-size:11px;color:#7a8b80}#save-location,#save-description,#save-error{font-size:12px}#save-error{color:#98632b;min-height:21px}\n\n.brand .switch-tool{display:inline-block;margin-left:9px;padding:1px 0;border:0;border-radius:2px;background:transparent;color:#849087;font-size:10px;font-weight:400;letter-spacing:0;vertical-align:2px}.brand .switch-tool:hover{color:#4e7768;background:transparent;text-decoration:underline}.brand .switch-tool:focus-visible{outline:2px solid #80c9bb;outline-offset:3px}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003c!-- 顶部：品牌、宿主切换、项目身份和文件操作；switch-tool 仅统一入口由 bridge 显示。 -->\n\u003cheader class=\"app-header\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">▦\u003c/span>\u003cdiv>\u003cstrong>面包板工作台\u003c/strong>\u003cbutton id=\"switch-tool\" class=\"switch-tool\" hidden>\u003c/button>\u003cspan class=\"brand-sub\">让每一个连接清楚可见\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"project-title\">\u003cspan id=\"project-name\">未命名电路\u003c/span>\u003cspan class=\"preview-badge\">本地布局 · 离线版\u003c/span>\u003c/div>\n    \u003cdiv class=\"header-actions\">\u003cbutton id=\"new-project\">新建空板\u003c/button>\u003cbutton id=\"reset\">载入示例\u003c/button>\u003cbutton id=\"undo\" disabled>撤销一步\u003c/button>\u003cbutton id=\"open-project\">打开项目\u003c/button>\u003cbutton id=\"export-image\">导出图片\u003c/button>\u003cdiv class=\"save-split\">\u003cbutton id=\"save-project\" class=\"primary\">保存项目\u003c/button>\u003cbutton id=\"save-menu-toggle\" class=\"primary\" aria-label=\"保存选项\" aria-haspopup=\"menu\" aria-expanded=\"false\" aria-controls=\"save-menu\">▾\u003c/button>\u003cdiv id=\"save-menu\" role=\"menu\" hidden>\u003cbutton id=\"save-as\" role=\"menuitem\">另存为…\u003c/button>\u003c/div>\u003c/div>\u003cinput id=\"project-file\" type=\"file\" accept=\".breadboard.json,.json,application/json\" hidden>\u003c/div>\n  \u003c/header>\n  \u003cmain class=\"app-layout\">\n    \u003c!-- 左栏工具/板序/板型：固定 ID 被 app.js 直接绑定，改 ID 必须同步事件及回归。 -->\n\u003caside class=\"left-panel\" aria-label=\"工具与板型\">\n      \u003csection>\n        \u003cdiv class=\"section-heading\">\u003ch2>元件与工具\u003c/h2>\u003cspan>基础编辑\u003c/span>\u003c/div>\n        \u003cdiv class=\"tool-grid\" id=\"tools\">\n          \u003cbutton class=\"tool active\" data-tool=\"select\" aria-pressed=\"true\">\u003cspan class=\"tool-symbol select-symbol\">↖\u003c/span>选择\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"wire\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol wire-symbol\">╱\u003c/span>飞线\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"resistor\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol resistor-symbol\">\u003c/span>电阻\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"capacitor\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol ceramic-symbol\">\u003c/span>电容\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"diode\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol diode-symbol\">▰│\u003c/span>二极管\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"transistor\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol transistor-symbol\">◖\u003c/span>三极管\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"chip\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol chip-symbol\">▥\u003c/span>芯片\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"port\" aria-pressed=\"false\">\u003cspan class=\"tool-symbol port-symbol\">⟶\u003c/span>引出线\u003c/button>\n        \u003c/div>\n        \u003cp class=\"tool-hint\" id=\"tool-hint\">点击孔位查看板内连接；点击示例元件查看属性。\u003c/p>\n        \u003cdiv id=\"tool-options\" class=\"tool-options\" hidden>\n          \u003cdiv id=\"wire-options\">\u003cspan class=\"palette-label\">飞线颜色\u003c/span>\u003cdiv id=\"wire-color\" class=\"color-palette\" role=\"radiogroup\" aria-label=\"飞线颜色\">\u003c/div>\u003c/div>\n          \u003cdiv id=\"resistor-options\">\u003c/div>\n          \u003cdiv id=\"capacitor-options\">\u003clabel>电容参数\u003cinput id=\"capacitor-value\" value=\"100 nF\" maxlength=\"120\">\u003c/label>\u003cp class=\"detail-note\">无极性示意，依次点选两脚；极性可在脚名中标注。\u003c/p>\u003c/div>\n          \u003cdiv id=\"diode-options\">\u003clabel>型号 / 参数\u003cinput id=\"diode-value\" value=\"1N4148\" maxlength=\"120\">\u003c/label>\u003cbutton id=\"diode-reverse\" type=\"button\" class=\"toggle-button\" aria-pressed=\"false\">按空格换向\u003c/button>\u003cp class=\"detail-note\">浅色色环靠第 2 脚（K）；换向交换两脚，以实物为准。\u003c/p>\u003c/div>\n          \u003cdiv id=\"transistor-options\">\u003clabel>型号 / 参数\u003cinput id=\"transistor-value\" value=\"9013\" maxlength=\"120\">\u003c/label>\u003cbutton id=\"transistor-reverse\" type=\"button\" class=\"toggle-button\" aria-pressed=\"false\">按空格换向\u003c/button>\u003cp class=\"detail-note\">沿排数固定三脚，不预设 E/B/C；点击三孔起始孔放下。反转以中脚为轴，外侧两脚交换位置。\u003c/p>\u003c/div>\n          \u003cdiv id=\"port-options\">\u003clabel>信号标签\u003cinput id=\"port-name\" value=\"信号\" maxlength=\"120\">\u003c/label>\u003clabel>引出方向\u003cselect id=\"port-direction\">\u003coption value=\"left\">向上\u003c/option>\u003coption value=\"right\">向下\u003c/option>\u003c/select>\u003c/label>\u003cspan class=\"palette-label\">颜色\u003c/span>\u003cdiv id=\"port-color\" class=\"color-palette\" role=\"radiogroup\" aria-label=\"引出线颜色\">\u003c/div>\u003cp class=\"detail-note\">放置中空格换向；横板上下、竖板左右，标签引到全部板之外。同名标签不自动相连。\u003c/p>\u003c/div>\n          \u003cdiv id=\"chip-options\">\u003clabel>DIP 引脚数\u003cselect id=\"chip-count\">\u003coption>4\u003c/option>\u003coption>6\u003c/option>\u003coption selected>8\u003c/option>\u003coption>10\u003c/option>\u003coption>12\u003c/option>\u003coption>14\u003c/option>\u003coption>16\u003c/option>\u003coption>18\u003c/option>\u003coption>20\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"chip-reverse\" type=\"button\" class=\"toggle-button\" aria-pressed=\"false\">按空格换向\u003c/button>\u003cp class=\"detail-note\">主区任意列选择安装起始排，自动跨槽预览；全部引脚可放时单击落下。反向时 1 脚在 F 侧安装范围末排。\u003c/p>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection id=\"board-controls\" class=\"board-settings\" aria-label=\"板子排列\">\n        \u003cdiv class=\"section-heading\">\u003ch2>板子排列\u003c/h2>\u003cspan id=\"board-count\">\u003c/span>\u003c/div>\n        \u003cp id=\"board-selection\" class=\"board-selection\" role=\"status\">点击画布上的板号选择板子\u003c/p>\n        \u003cdiv class=\"board-actions\">\u003cbutton id=\"board-append\">末尾加板\u003c/button>\u003cbutton id=\"board-delete\">删除板子\u003c/button>\u003cbutton id=\"board-before\">前面插入\u003c/button>\u003cbutton id=\"board-after\">后面插入\u003c/button>\u003c/div>\n        \u003cp id=\"board-order-hint\" class=\"detail-note\">\u003c/p>\n      \u003c/section>\n      \u003csection class=\"board-settings\">\n        \u003cdiv class=\"section-heading\">\u003ch2>统一板型\u003c/h2>\u003cspan>全部板共用\u003c/span>\u003c/div>\n        \u003clabel class=\"field-label\" for=\"rows\">主区排数\u003c/label>\n        \u003cselect id=\"rows\">\u003coption value=\"30\">30 排\u003c/option>\u003coption value=\"40\">40 排\u003c/option>\u003coption value=\"50\">50 排\u003c/option>\u003coption value=\"60\" selected>60 排\u003c/option>\u003coption value=\"70\">70 排\u003c/option>\u003c/select>\n        \u003cspan class=\"field-label\">显示方向\u003c/span>\n        \u003cdiv class=\"segmented\" id=\"orientation\">\u003cbutton data-orientation=\"vertical\" aria-pressed=\"false\">纵向\u003c/button>\u003cbutton class=\"active\" data-orientation=\"horizontal\" aria-pressed=\"true\">横向\u003c/button>\u003c/div>\n        \u003clabel class=\"field-label\" for=\"rails\">每侧电源轨\u003c/label>\n        \u003cselect id=\"rails\">\u003coption value=\"2\">2 条\u003c/option>\u003coption value=\"1\">1 条\u003c/option>\u003coption value=\"0\">无电源轨\u003c/option>\u003coption value=\"custom\">两侧分别设置\u003c/option>\u003c/select>\n        \u003clabel class=\"field-label\" for=\"rail-mode\">每条电源轨的导通方式\u003c/label>\n        \u003cselect id=\"rail-mode\">\u003coption value=\"1\">整条导通\u003c/option>\u003coption value=\"2\" selected>两段独立（默认）\u003c/option>\u003coption value=\"3\">三段独立\u003c/option>\u003coption value=\"custom\">逐轨自定义\u003c/option>\u003c/select>\n        \u003cp class=\"setting-detail\" id=\"rail-summary\">\u003c/p>\n        \u003cbutton type=\"button\" id=\"rail-settings\" class=\"settings-button\">逐轨设置…\u003c/button>\n        \u003cp id=\"config-error\" class=\"config-error\" role=\"alert\" hidden>\u003c/p>\n        \u003clabel class=\"checkbox-label\">\u003cinput type=\"checkbox\" id=\"snap-hint\" checked>就近吸附到孔位\u003c/label>\n      \u003c/section>\n      \u003cdiv class=\"scope-note\">\u003cstrong>当前可体验\u003c/strong>\u003cp>电阻、电容、二极管、三极管、DIP、飞线与引出线；支持连续放置、复制、脚名和项目文件。\u003c/p>\u003cp>选中后 M 移动、C 复制、Del 删除；空格换向二极管、三极管、芯片及引出线。\u003c/p>\u003c/div>\n      \u003csection class=\"draft-note\" aria-label=\"本地草稿\">\u003cstrong>本地草稿\u003c/strong>\u003cp id=\"draft-state\" role=\"status\">正在检查本地草稿…\u003c/p>\u003cbutton id=\"draft-retry\" type=\"button\" hidden>重试草稿\u003c/button>\u003cp>仅保存已完成操作；文件备份请用“保存项目”。\u003c/p>\u003c/section>\n    \u003c/aside>\n    \u003c!-- 主画布：正式孔/对象、网络高亮和临时预览分层；工程只由 model/editor 提供，不从 SVG 恢复。 -->\n\u003csection class=\"workspace\" aria-label=\"面包板预览区\">\n      \u003cdiv class=\"canvas-toolbar\">\u003cdiv>\u003cspan class=\"live-dot\">\u003c/span>\u003cstrong id=\"board-title\">B1 · 60 排面包板\u003c/strong>\u003c/div>\u003cdiv class=\"view-actions\">\u003cbutton id=\"zoom-out\" aria-label=\"缩小\">−\u003c/button>\u003coutput id=\"zoom-label\">100%\u003c/output>\u003cbutton id=\"zoom-in\" aria-label=\"放大\">＋\u003c/button>\u003cbutton id=\"fit\">显示全部\u003c/button>\u003c/div>\u003c/div>\n      \u003csection class=\"frame-panel\" id=\"frame-panel\" aria-label=\"新板型预览\" hidden>\n        \u003cdiv class=\"frame-heading\">\u003cstrong>新板型预览\u003c/strong>\u003cspan>绿色保留 · 红色删除\u003c/span>\u003c/div>\n        \u003cp>框沿最外孔位的外沿显示。左键拖框逐排移动，右键平移画面。元件完整外形、整条飞线须在框内，引脚也须对孔；引出线的板外标注除外，仅检查插孔。\u003c/p>\n        \u003cdiv class=\"frame-controls\">\u003cbutton id=\"frame-back\" aria-label=\"板型框前移一排\">−1 排\u003c/button>\u003clabel>偏移排数 \u003cinput id=\"frame-offset\" type=\"number\" step=\"1\" value=\"0\">\u003c/label>\u003cbutton id=\"frame-forward\" aria-label=\"板型框后移一排\">＋1 排\u003c/button>\u003c/div>\n        \u003cdiv id=\"frame-summary\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv id=\"frame-list\" class=\"frame-list\">\u003c/div>\n        \u003cdiv class=\"frame-actions\">\u003cbutton id=\"frame-cancel\">取消修改\u003c/button>\u003cbutton id=\"frame-apply\" class=\"primary\">确认板型\u003c/button>\u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"compact-inspector\" id=\"compact-inspector\" aria-live=\"polite\">点击孔位查看编号与导通范围\u003c/div>\n      \u003cdiv class=\"canvas\" id=\"canvas\">\u003csvg id=\"board\" role=\"group\" aria-label=\"面包板孔位示意，可点击孔位查看连接\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\u003cdiv id=\"edit-banner\" class=\"edit-banner\" hidden>\u003cspan id=\"edit-message\" role=\"status\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"edit-cancel\">取消 / Esc\u003c/button>\u003c/div>\u003cdiv class=\"canvas-caption\">滚轮缩放 · 右键拖动平移 · 左键框选 · Ctrl 多选\u003c/div>\u003c/div>\n      \u003cdiv class=\"connection-strip\">\u003cspan class=\"legend-item\">\u003ci class=\"legend-hole empty\">\u003c/i>空孔\u003c/span>\u003cspan class=\"legend-item\">\u003ci class=\"legend-hole occupied\">\u003c/i>已占用\u003c/span>\u003cspan class=\"legend-item\">\u003ci class=\"legend-hole connected\">\u003c/i>当前网络\u003c/span>\u003cspan class=\"legend-note\">交叉飞线不自动连接\u003c/span>\u003c/div>\n      \u003cfooter class=\"status-bar\">\u003cspan id=\"status\" role=\"status\" aria-live=\"polite\">请选择一个孔位或示例元件。\u003c/span>\u003cspan>本地运行 · 无网络依赖\u003c/span>\u003c/footer>\n    \u003c/section>\n    \u003c!-- 右栏为选孔/对象详情和属性表单；脚的物理身份与显示脚名分开维护。 -->\n\u003caside class=\"right-panel\" aria-label=\"属性与连接信息\">\n      \u003csection>\u003cdiv class=\"section-heading\">\u003ch2 id=\"detail-heading\">孔位与属性\u003c/h2>\u003cspan id=\"detail-kind\">未选择\u003c/span>\u003c/div>\u003cdiv id=\"details\">\u003cdiv class=\"empty-selection\">\u003cspan aria-hidden=\"true\">◎\u003c/span>\u003cstrong>从一个孔位开始\u003c/strong>\u003cp>点击面包板上的孔，查看编号、占用状态和实际导通范围。\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n      \u003csection class=\"number-guide\">\u003ch2>编号与板内连接\u003c/h2>\u003cdiv class=\"column-guide\">\u003cspan>A B C D E\u003c/span>\u003ci>槽\u003c/i>\u003cspan>F G H I J\u003c/span>\u003c/div>\u003cp>每一排 A～E 相通，F～J 相通；中央槽两侧不相通。\u003c/p>\u003cdiv class=\"example-id\">B1:A16 \u003csmall>板号 : 字母列 + 排号\u003c/small>\u003c/div>\u003cp>横竖切换只旋转画面，孔号保持不变。\u003c/p>\u003c/section>\n      \u003csection class=\"rail-guide\">\u003ch2>电源轨怎么看\u003c/h2>\u003cdiv class=\"rail-diagram\" aria-hidden=\"true\">\u003cspan>•••••\u003c/span>\u003cspan>•••••\u003c/span>\u003ci>间隙\u003c/i>\u003cspan>•••••\u003c/span>\u003c/div>\u003cp>五孔组之间的外观间隙不代表电气断开。分段处有断点标记，各段独立导通。红蓝颜色和正负标记不自动赋予电压。\u003c/p>\u003c/section>\n    \u003c/aside>\n  \u003c/main>\n  \u003c!-- 模态区：轨道、冲突、保存和导出。窗口打开时阻止画布快捷键；取消不得消费历史。 -->\n\u003cdialog id=\"rail-dialog\" aria-labelledby=\"rail-dialog-title\">\n    \u003cform id=\"rail-form\" novalidate>\n      \u003cdiv class=\"dialog-heading\">\u003cdiv>\u003ch2 id=\"rail-dialog-title\">板型与电源轨\u003c/h2>\u003cp>每个数字代表一段的五孔组数。例如 3,4,3 = 15 孔 + 20 孔 + 15 孔，三段互不导通。\u003c/p>\u003c/div>\u003cbutton type=\"button\" id=\"rail-close\" aria-label=\"关闭板型设置\">×\u003c/button>\u003c/div>\n      \u003cdiv class=\"dialog-controls\">\n        \u003clabel>主区排数\u003cselect id=\"config-rows\">\u003coption value=\"30\">30 排\u003c/option>\u003coption value=\"40\">40 排\u003c/option>\u003coption value=\"50\">50 排\u003c/option>\u003coption value=\"60\">60 排\u003c/option>\u003coption value=\"70\">70 排\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>A～E 侧轨道数\u003cselect id=\"rail-left-count\">\u003coption value=\"0\">无\u003c/option>\u003coption value=\"1\">1 条\u003c/option>\u003coption value=\"2\">2 条\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>F～J 侧轨道数\u003cselect id=\"rail-right-count\">\u003coption value=\"0\">无\u003c/option>\u003coption value=\"1\">1 条\u003c/option>\u003coption value=\"2\">2 条\u003c/option>\u003c/select>\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"rail-presets\">\u003cspan>快速填充全部轨道\u003c/span>\u003cbutton type=\"button\" data-rail-preset=\"1\">单段\u003c/button>\u003cbutton type=\"button\" data-rail-preset=\"2\">两段\u003c/button>\u003cbutton type=\"button\" data-rail-preset=\"3\">三段\u003c/button>\u003c/div>\n      \u003cdiv id=\"rail-fields\" class=\"rail-fields\">\u003c/div>\n      \u003cp class=\"dialog-help\">PL 表示 A～E 侧，PR 表示 F～J 侧。各轨可有不同的孔数和分段。有效配置将进入可移动的板型框预览，确认前不会修改原板子或删除对象。\u003c/p>\n      \u003cp id=\"rail-error\" class=\"config-error\" role=\"alert\" hidden>\u003c/p>\n      \u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" id=\"rail-cancel\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">预览新板型\u003c/button>\u003c/div>\n    \u003c/form>\n  \u003c/dialog>\n  \u003cdialog id=\"confirm-dialog\" aria-labelledby=\"confirm-title\">\u003ch2 id=\"confirm-title\">请确认\u003c/h2>\u003cp id=\"confirm-message\">\u003c/p>\u003cul id=\"confirm-list\">\u003c/ul>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"confirm-cancel\">取消\u003c/button>\u003cbutton id=\"confirm-alternative\" hidden>\u003c/button>\u003cbutton id=\"confirm-ok\" class=\"primary\">确认\u003c/button>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"export-dialog\" aria-labelledby=\"export-title\">\u003ch2 id=\"export-title\">导出布局图片\u003c/h2>\u003cp id=\"export-description\">\u003c/p>\u003cp id=\"export-state\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"export-cancel\">取消\u003c/button>\u003cbutton id=\"export-boards\">每板一张 · ZIP\u003c/button>\u003cbutton id=\"export-all\" class=\"primary\">完整布局 · PNG\u003c/button>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"save-dialog\" aria-labelledby=\"save-title\">\u003cform id=\"save-form\">\u003ch2 id=\"save-title\">保存项目\u003c/h2>\u003cp id=\"save-description\">\u003c/p>\u003clabel class=\"save-field\" for=\"save-name\">项目名称 / 文件名\u003cinput id=\"save-name\" maxlength=\"120\" required autocomplete=\"off\">\u003csmall>文件扩展名为 .breadboard.json，无需重复填写。\u003c/small>\u003c/label>\u003clabel class=\"save-field\" for=\"save-method\">保存方式\u003cselect id=\"save-method\">\u003coption value=\"native\">选择文件夹和文件名\u003c/option>\u003coption value=\"download\">浏览器下载\u003c/option>\u003c/select>\u003c/label>\u003cp id=\"save-location\">\u003c/p>\u003cp id=\"save-error\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"save-cancel\" type=\"button\">取消\u003c/button>\u003cbutton id=\"save-confirm\" type=\"submit\" class=\"primary\">选择位置并保存\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n  \u003c!-- 脚本依赖：model → editor → draft/export/files → app；离线构建原样内联，保留模块注释。 -->\n\u003cscript>\n/**\n * 模块：面包板几何、固有导通与坐标变换\n * 源文件：preview/dist/model.js；此说明会随离线打包保留。\n * 无 DOM。浏览器导出 BreadboardPreview，Node 检查通过 CommonJS 复用同一实现。\n * 孔号 Bn:A12 使用稳定板 ID；横竖只改投影。intrinsic 表示面包板铜片，occupied 表示实体插孔，二者不能混为一谈。\n *\n * 重要变量与不变量：\n * - LETTERS/PRESETS/GROUPS：主区字母、允许排数与每轨五孔组数；PITCH/HOLE_SIZE 为逻辑像素。MAX_BOARDS/BOARD_GAP 限制拼板数量和间距。\n */\n(function (root) {\n  'use strict';\n  const LETTERS = 'ABCDEFGHIJ';\n  const PRESETS = [30, 40, 50, 60, 70];\n  const GROUPS = {30: 5, 40: 6, 50: 8, 60: 10, 70: 11};\n  const PITCH = 15;\n  const HOLE_SIZE = 7.4;\n  const MAX_BOARDS = 8, BOARD_GAP = 0;\n  /** presetSegments：把五孔组总数分为 1/2/3 段；三段采用两端对称布局，返回每段的五孔组数，而不是孔数。\n   */\n  function presetSegments(rows = 60, count = 2) {\n    if (!PRESETS.includes(rows) || ![1, 2, 3].includes(count)) throw new Error('不支持的排数或预置分段数');\n    const total = GROUPS[rows], base = Math.floor(total / count), extra = total % count;\n    if (count === 3) {\n      const end = Math.round(total / 3);\n      return [end, total - 2 * end, end];\n    }\n    return Array.from({length:count}, (_, i) => base + (i >= count - extra ? 1 : 0));\n  }\n  /** parseSegments：解析逗号/空白分隔的正整数组数，接受中英文逗号；拒绝零、负值、非整数及过多分段。\n   */\n  function parseSegments(text) {\n    const tokens = text.trim().split(/[,，\\s]+/);\n    if (!text.trim() || tokens.some(token => !/^[1-9]\\d*$/.test(token))) throw new Error('请用逗号分隔正整数，例如 5,5 或 3,4,3；每个数字代表一段的五孔组数');\n    const values = tokens.map(Number);\n    if (values.length > 32 || values.some(value => !Number.isSafeInteger(value))) throw new Error('分段数或组数过大');\n    return values;\n  }\n  /** normalizeConfig：验证主区排数、左右电源轨数量和各轨分段；逐轨五孔组总数必须符合板型，返回规范化配置。\n   */\n  function normalizeConfig(input = {}) {\n    const rows = input.rows ?? 60;\n    if (!PRESETS.includes(rows)) throw new Error('主区排数应为 30、40、50、60 或 70');\n    const config = {rows, railCounts:{}, railSegments:{L:[], R:[]}};\n    for (const side of ['L', 'R']) {\n      const count = input.railCounts?.[side] ?? input.rails ?? 2;\n      if (![0, 1, 2].includes(count)) throw new Error('每侧电源轨数量应为 0、1 或 2');\n      config.railCounts[side] = count;\n      for (let i = 0; i \u003c count; i++) {\n        const segments = input.railSegments?.[side]?.[i] ?? presetSegments(rows, input.split === false ? 1 : 2);\n        const label = `P${side}${i + 1}`;\n        if (!Array.isArray(segments) || !segments.length || segments.length > 32 || segments.some(n => !Number.isSafeInteger(n) || n \u003c= 0)) throw new Error(`${label} 的每段五孔组数必须为正整数`);\n        const groups = segments.reduce((a,b) => a+b, 0);\n        const spanSlots = groups * 5 - 1 + groups - 1 + segments.length - 1;\n        if (!Number.isSafeInteger(groups) || spanSlots > rows + 1) throw new Error(`${label} 的电源轨过长，${rows} 排板放不下；请减少五孔组数、分段数或增加主区排数`);\n        config.railSegments[side].push([...segments]);\n      }\n    }\n    return config;\n  }\n  /** buildBoard：生成单板孔阵列、主区固有导通组及电源轨分段。\n   * 逻辑像素 PITCH 不代表实物尺寸；intrinsic 描述制造时已相连的铜片，不含用户飞线。\n   */\n  function buildBoard(input = {}) {\n    const config = normalizeConfig(input), {rows, railCounts, railSegments} = config;\n    const holes = [];\n    const byId = new Map();\n    const intrinsic = new Map();\n    /** add：向当前几何或 SVG 构建上下文添加一个节点；只维护局部索引/父节点，不产生新的电气连接。\n     */\n    const add = hole => {\n      hole.id = `B1:${hole.localId}`;\n      holes.push(hole); byId.set(hole.id, hole);\n      if (!intrinsic.has(hole.group)) intrinsic.set(hole.group, []);\n      intrinsic.get(hole.group).push(hole.id);\n    };\n    const width = 340, firstY = 52, height = (rows - 1) * PITCH + 104;\n    for (let row = 1; row \u003c= rows; row++) {\n      for (let col = 0; col \u003c 10; col++) {\n        add({localId: `${LETTERS[col]}${row}`, kind:'main', row, letter: LETTERS[col],\n          x: 85 + col * PITCH + (col >= 5 ? 35 : 0), y:firstY + (row - 1) * PITCH,\n          group:`main:${row}:${col \u003c 5 ? 'AE' : 'FJ'}`});\n      }\n    }\n    const tracks = [];\n    for (const side of ['L', 'R']) {\n      for (let track = 1; track \u003c= railCounts[side]; track++) {\n        const segments = railSegments[side][track - 1], groups = segments.reduce((a,b) => a+b, 0);\n        const trackSpan = (groups * 5 - 1 + groups - 1 + segments.length - 1) * PITCH;\n        const startY = firstY + Math.floor(((rows pin[1]!=='string'||!board.byId.has(pin[1]))throw new Error(`${part.id} 引脚或孔位无效`);\n      return [...pin];\n    });\n    if(new Set(part.pins.map(p=>p[0])).size!==part.pins.length)throw new Error(`${part.id} 引脚名称重复`);\n    if(part.kind!=='wire'&&new Set(part.pins.map(p=>M.boardIdOf(p[1]))).size>1)throw new Error('只有飞线可以跨板，元件全部引脚须在同一块板上');\n    const expectedCount=part.kind==='port'?1:part.kind==='transistor'?3:part.kind==='chip'?null:2;\n    if(expectedCount!==null&&part.pins.length!==expectedCount)throw new Error(`${part.id} 必须有 ${expectedCount} 个引脚`);\n    if(part.kind==='chip'){\n      if(raw.reverse!==undefined&&typeof raw.reverse!=='boolean')throw new Error('芯片方向无效');\n      part.reverse=raw.reverse??false;\n      const row=Math.min(...part.pins.map(p=>board.byId.get(p[1]).row??Infinity));\n      const expected=chipPins(board,row,part.pins.length,part.reverse,M.boardIdOf(part.pins[0][1]));\n      if(expected.some((p,i)=>p[1]!==part.pins[i][1]))throw new Error(`${part.id} 必须跨槽插在 E/F 列，脚号沿封装依次排列`);\n    }\n    if(['resistor','capacitor','diode'].includes(part.kind)){\n      const [a,b]=part.pins.map(p=>board.byId.get(p[1]));\n      if(Math.hypot(a.x-b.x,a.y-b.y)>board.pitch*10+1e-6)throw new Error(`${TYPES[part.kind]}两脚距离不能超过 10 个孔距`);\n    }\n    if(part.kind==='diode'){\n      if(raw.reverse!==undefined&&typeof raw.reverse!=='boolean')throw new Error('二极管反向状态无效');\n      part.reverse=raw.reverse??false;\n    }\n    if(part.kind==='transistor'){\n      if(raw.reverse!==undefined&&typeof raw.reverse!=='boolean')throw new Error('三极管反转状态无效');\n      part.reverse=raw.reverse??false;\n      const [a,b,c]=part.pins.map(p=>board.byId.get(p[1])),dx=b.x-a.x,dy=b.y-a.y;\n      if(!((Math.abs(dx)===board.pitch&&dy===0)||(Math.abs(dy)===board.pitch&&dx===0))||c.x-b.x!==dx||c.y-b.y!==dy)throw new Error('三极管须按一个孔距连续排列三脚');\n    }\n    if(part.kind==='port'){\n      part.direction=raw.direction??'left';\n      part.color=wireColor(raw.color);\n      if(!['left','right'].include eId=null){\n    const p=normalizePart(board,candidate);\n    const original=parts.find(item=>item.id===replaceId);\n    if(original?.kind==='chip'&&(p.kind!=='chip'||p.pins.length!==original.pins.length))throw new Error('已放置芯片的封装不能修改，请删除后重新放置');\n    if(original&&p.pins.some(([name],i)=>name!==original.pins[i]?.[0]&&Array.from(name).length>3))throw new Error('引脚名称最多 3 个字符');\n    const next=parts.filter(item=>item.id!==replaceId).concat(p),valid=validateParts(board,next);\n    return {...valid,part:p,warnings:newWarnings(board,parts,board,valid.parts)};\n  }\n  /** movePart：以原第一脚和目标孔之差平移引脚及旧路径；根据真实孔坐标反查落点，缺孔/越界时拒绝。\n   */\n  function movePart(board,part,targetId){\n    const target=board.byId.get(targetId),anchor=board.byId.get(part.pins[0][1]);\n    if(!target)throw new Error('请选择实际孔位');\n    const dx=target.x-anchor.x,dy=target.y-anchor.y;\n    const lookup=new Map(board.holes.filter(h=>part.kind==='wire'||M.boardIdOf(h.id)===M.boardIdOf(target.id)).map(h=>[`${h.x}:${h.y}`,h.id]));\n    const next={...part,pins:part.pins.map(([name,id])=>{\n      const h=board.byId.get(id),dest=lookup.get(`${h.x+dx}:${h.y+dy}`);\n      if(!dest)throw new Error('部分引脚没有对应孔位，不能落下');\n      return [name,dest];\n    })};\n    if(part.pathPoints)next.pathPoints=part.pathPoints.map(p=>({x:p.x+dx,y:p.y+dy}));\n    return next;\n  }\n  /** nextId：按对象类型前缀寻找首个未使用的正整数位号；检查现有 ID，避免复制或删除后重用造成冲突。\n   */\n  function nextId(parts,kind){\n    const prefix={wire:'W',resistor:'R',capacitor:'C',diode:'D',transistor:'Q',chip:'U',port:'P'}[kind];let n=1;\n    while(parts.some(p=>p.id===`${prefix}${n}`))n++;\n    return `${prefix}${n}`;\n  }\n  /** moveParts：以选中锚对象第一脚为基准，对整组施加相同物理位移；所有脚需落到真实孔，旧线身路径一起平移。\n   */\n  function moveParts(board,originals,anchorId,targetId){\n    const source=originals.find(p=>p.id===anchorId),anchor=board.byId.get(source?.pins[0][1]),target=board.byId.get(targetId);\n    if(!source||!target)throw new Error('请选择移动定位孔');\n    const dx=target.x-anchor.x,dy=target.y-anchor.y,lookup=new Map(board.holes.map(h=>[`${h.x}:${h.y}`,h.id]));\n    return originals.map(part=>normalizePart(board,{...part,pins:part.pins.map(([name,id])=>{\n      const h=board.byId.get(id),next=lookup.get(`${h.x+dx}:${h.y+dy}`);if(!next)throw new Error(`${part.id} 部分引脚没有对应孔位，不能落下`);return [name,next];\n    }),...(part.pathPoints?{pathPoints:part.pathPoints.map(p=>({x:p.x+dx,y:p.y+dy}))}:{})}));\n  }\n  /** planMoveParts：为整组移动生成两个冲突策略的候选。\n   * 先独立验证移动组，组内几何/占孔错误不能靠删除外部对象修复；再找未选对象与目标脚重叠的孔，按整个对象决定保留原位或移动侧，最后重建连接和新增网络警告。\n   */\n  function planMoveParts(board,parts,candidates,{resolveConflicts=false,keep='moving'}={}){\n    if(!['moving','fixed'].includes(keep))throw new Error('冲突处理方式无效');\n    const replacements=new Map(candidates.map(p=>[p.id,p]));\n    if(!candidates.length||replacements.size!==candidates.length||candidates.some(p=>!parts.some(old=>old.id===p.id)))throw new Error('多选移动对象无效');\n    // Validate the selected group on its own first: deleting other objects cannot repair its geometry.\n    const group=validateParts(board,candidates),conflicts=[];\n    if(resolveConflicts&&candidates.length>1)for(const part of parts){\n      if(replacements.has(part.id))continue;\n      const holes=part.pins.map(pin=>pin[1]).filter(id=>group.connections.occupied.has(id));\n      if(holes.length)conflicts.push({part,holes:[...new Set(holes)]});\n    }\n    const occupied=new Set(conflicts.flatMap(c=>c.holes));\n    const movingConflicts=candidates.filter(p=>p.pins.some(pin=>occupied.has(pin[1]))).map(p=>({part:parts.find(old=>old.id===p.id),holes:p.pins.map(pin=>pin[1]).filter(id=>occupied.has(id))}));\n    const removed=(keep==='fixed'?movingConflicts:conflicts).map(c=>c.part),removedIds=new Set(removed.map(p=>p.id));\n    const valid=validateParts(board,parts.filter(p=>!removedIds.has(p.id)).map(p=>replacements.get(p.id)??p));\n    return {...valid,conflicts,movingConflicts,removed,moved:valid.parts.filter(p=>replacements.has(p.id)),warnings:newWarnings(board,parts,board,valid.parts)};\n  }\n  /** partsInRect：只选择包围盒完整落在矩形内的对象；使用与绘图相同的本体/线身几何和小容差，不把部分相交当全选。\n   */\n  function partsInRect(board,parts,rect,orientation='vertical',externalBounds=null){\n    if(!rect||![rect.minX,rect.minY,rect.maxX,rect.maxY].every(Number.isFinite))throw new Error('框选范围无效');\n    return parts.filter(p=>{const b=M.partGeometry(board,p,orientation,externalBounds).bounds;return b.minX>=rect.minX-1e-6&&b.maxX\u003c=rect.maxX+1e-6&&b.minY>=rect.minY-1e-6&&b.maxY\u003c=rect.maxY+1e-6;}).map(p=>p.id);\n  }\n  /** reconnectPart：仅移动指定对象的一只脚，另一只脚及其他对象保留；返回候选，跨度与占孔仍须经过验证。\n   */\n  function reconnectPart(board,part,index,targetId){\n    if(!TWO_PIN_KINDS.includes(part.kind)||![0,1].includes(index))throw new Error('仅飞线和两脚元件支持单脚重接');\n    const target=board.byId.get(targetId);if(!target)throw new Error('请选择实际孔位');\n    const next={...part,pins:part.pins.map((pin,i)=>[pin[0],i===index?targetId:pin[1]])};\n    if(part.pathPoints)next.pathPoints=part.pathPoints.map((p,i)=>i===(index===0?0:part.pathPoints.length-1)?{x:target.x,y:target.y}:{...p});\n    return next;\n  }\n  /** copyPart：复制对象到目标孔，生成不冲突的新位号，保留参数、脚名与支持的方向；原对象仍参与占孔校验。\n   */\n  function copyPart(board,parts,part,targetId){\n    return movePart(board,{...part,id:nextId(parts,part.kind)},targetId);\n  }\n  /** transistorPins：根据安装锚点和支持的方向生成三极管的三个实体脚；脚号表示物理身份，不推断 E/B/C 电气含义。\n   */\n  function transistorPins(board,targetId,axis='rows'){\n    const anchor=board.byId.get(targetId);if(!anchor||!['rows','columns'].includes(axis))throw new Error('请选择三极管的实际孔位及排列方向');\n    const byPosition=new Map(board.holes.map(h=>[`${h.x}:${h.y}`,h.id]));\n    return Array.from({length:3},(_,i)=>{\n      const id=byPosition.get(`${anchor.x+(axis==='columns'?i*board.pitch:0)}:${anchor.y+(axis==='rows'?i*board.pitch:0)}`);\n      if(!id)throw new Error('三极管引脚没有对应孔位');return [String(i+1),id];\n    });\n  }\n  /** flipTransistor：围绕中脚交换三极管外侧两脚并翻转外观；物理脚名随脚移动，不推断极性。\n   */\n  function flipTransistor(board,part){\n    if(part.kind!=='transistor')throw new Error('只有三极管支持此反转操作');\n    const center=board.byId.get(part.pins[1][1]),byPosition=new Map(board.holes.map(h=>[`${h.x}:${h.y}`,h.id]));\n    return {...part,reverse:!(part.reverse??false),pins:part.pins.map(([name,id])=>{\n      const h=board.byId.get(id),next=byPosition.get(`${2*center.x-h.x}:${2*center.y-h.y}`);\n      if(!next)throw new Error('反转后引脚没有对应孔位');return [name,next];\n    })};\n  }\n  /** flipPart：按类型执行允许的换向：交换二极管极性、翻转三极管/DIP 或改变引出方向。返回候选对象，不直接提交。\n   */\n  function flipPart(board,part){\n    if(part.kind==='transistor')return flipTransistor(board,part);\n    if(part.kind==='diode')return {...part,reverse:!(part.reverse??false),pins:part.pins.map(([name,id],i)=>[name,part.pins[1-i][1]])};\n    if(part.kind==='chip'){\n      const row=Math.min(...part.pins.map(p=>board.byId.get(p[1]).row)),reverse=!(part.reverse??false);\n      const positions=chipPins(board,row,part.pins.length,reverse,M.boardIdOf(part.pins[0][1]));\n      return {...part,reverse,pins:part.pins.map(([name],i)=>[name,positions[i][1]])};\n    }\n    if(part.kind==='port')return {...part,direction:part.direction==='right'?'left':'right'};\n    throw new Error('仅二极管、三极管、芯片和引出线支持换向');\n  }\n  /** projectData：将当前正式工程与查看设置转换为本工具版本化 JSON 数据；运行时选择、预览、撤销及文件句柄不写入。\n   */\n  function projectData(board,parts,view,name='未命名电路'){\n    const valid=validateParts(board,parts);\n    const layout=M.normalizeLayout(board.layout),multiple=layout.boardIds.length!==1||layout.boardIds[0]!=='B1'||layout.nextBoardNumber!==2;\n    return {format:'breadboard-layout',version:multiple?2:1,name:text(name,'项目名称'),board:board.config,...(multiple?{layout,boardGap:0}:{}),parts:valid.parts,view:normalizeView(view)};\n  }\n  /** normalizeView：验证查看方向、缩放和平移等持久化字段，并仅返回受支持的数据；不信任导入文件中的任意属性。\n   */\n  function normalizeView(view={}){\n    if(!view||!['horizontal','vertical'].includes(view.orientation)||!Number.isFinite(view.zoom)||view.zoom\u003c.7||view.zoom>3||!view.pan||![view.pan.x,view.pan.y].every(n=>Number.isFin e);\n    return node;\n  }\n  /** status：更新状态提示文本；这是用户反馈，不是工程状态或保存成功的判断依据。\n   */\n  function status(text) {$('status').textContent = text;$('status').title=text;}\n  /** selectedIds：将单选/多选转换为对象 ID 数组；没有对象选择时返回空数组，孔位或整板选择另行处理。\n   */\n  function selectedIds(){return selected?.kind==='part'?[selected.id]:selected?.kind==='parts'?selected.ids:[];}\n  /** partSelected：判断指定位号是否在当前选择中，用于命中已选本体时启动直接拖动。\n   */\n  function partSelected(id){return selectedIds().includes(id);}\n  /** selectParts：过滤不存在的 ID 并去重，按数量规范化成 null、单选或多选状态；不修改工程和撤销。\n   */\n  function selectParts(ids){const unique=[...new Set(ids)].filter(id=>parts.some(p=>p.id===id));selected=unique.length>1?{kind:'parts',ids:unique}:unique.length?{kind:'part',id:unique[0]}:null;}\n  /** moveAnchor：多选优先用芯片作定位锚点，保证整组满足跨槽约束；否则优先保留实际抓住的对象，再取首项。\n   */\n  function moveAnchor(fallback=null){const items=parts.filter(p=>partSelected(p.id));return items.find(p=>p.kind==='chip')??items.find(p=>p.id===fallback)??items[0];}\n  /** signature：序列化工程名称和已提交布局作为保存签名；不把仅影响查看的缩放、平移等算成工程修改。\n   */\n  function signature(){return JSON.stringify({name:projectName,board:board.config,layout:board.layout,parts});}\n  /** committedProject：返回可持久化的已提交工程；尺寸预览时必须读取 frame.before 的原板和原视图，不能保存临时板框。\n   */\n  function committedProject(){\n    const state=frame?.before;\n    return state?E.projectData(state.board,state.parts,{orientation:state.orientation,zoom:state.zoom,pan:state.pan,snap:state.snap},state.projectName):E.projectData(board,parts,{orientation,zoom,pan,snap:$('snap-hint').checked},projectName);\n  }\n  /** getDraftStore：懒创建本工具独立的草稿存储适配器；存储访问异常转成可显示的 unavailable 错误，不阻断编辑。\n   */\n  function getDraftStore(){\n    try{return draftStore??(draftStore=D.createStore(window.localStorage));}\n    catch{const error=new Error('浏览器不允许使用本地草稿');error.code='unavailable';throw error;}\n  }\n  /** draftTime：把草稿时间转换为中文本地时间，仅用于界面显示，不参与工程比较。\n   */\n  function draftTime(value){return new Date(value).toLocaleString('zh-CN',{hour12:false});}\n  /** showDraftIssue：记录草稿错误、暂停正常自动写入并显示重试或接管入口；保留当前内存电路供用户另存文件。\n   */\n  function showDraftIssue(error){\n    draftIssue=error;$('draft-state').textContent=`${error.message}；请导出项目保留本页。`;\n    $('draft-state').parentElement.setAttribute('data-issue','');$('draft-retry').hidden=false;\n    $('draft-retry').textContent=error.code==='invalid'?'重新建立草稿':error.code==='conflict'?'接管草稿写入':'重试草稿';\n  }\n  /** queueDraft：将草稿写入防抖至最后一次变更后 450 ms；未初始化或存在草稿错误时不调度。\n   */\n  function queueDraft(){\n    if(!draftReady||draftIssue)return;clearTimeout(draftTimer);draftTimer=setTimeout(()=>flushDraft(),450);\n  }\n  /** flushDraft：立即写入已提交工程；相同内容指纹不重复写，force 用于明确接管。先清定时器，再处理存储错误，候选预览不应进入缓存。\n   */\n  function flushDraft(force=false){\n    clearTimeout(draftTimer);if(!draftReady||draftIssue&&!force)return;\n    try{\n      const project=committedProject(),fingerprint=JSON.stringify({project,unexported:dirty});\n      if(!force&&fingerprint===lastDraftFingerprint)return;\n      const savedAt=getDraftStore().save(project,dirty,{force});lastDraftFingerprint=fingerprint;draftIssue=null;\n      $('draft-state').textContent=`草稿已保存 ${draftTime(savedAt)}`;$('draft-state').parentElement.removeAttribute('data-issue');$('draft-retry').hidden=true;\n    }catch(error){showDraftIssue(error);}\n  }\n  /** initializeDraft：启动时验证并恢复本工具草稿及查看设置；不恢复预览、选择、撤销和文件句柄。损坏缓存保留原文，失败后仍允许手工编辑。\n   */\n  function initializeDraft(){\n    try{\n      const saved=getDraftStore().load();\n      if(saved){\n        board=saved.board;parts=saved.parts;connections=saved.connections;projectName=saved.name;({orientation,zoom,pan}=saved.view);$('snap-hint').checked=saved.view.snap;\n        savedSignature=saved.unexported?'':signature();undoState=null;selected=null;hovered=null;hoveredPart=null;setTool('select');\n        $('draft-state').textContent=`已恢复 ${draftTime(saved.savedAt)} 的草稿`;\n        status(`已恢复本地草稿，共 ${parts.length} 项；未完成的预览不恢复，请导出项目作备份。`);\n      }else $('draft-state').textContent='草稿就绪，编辑完成后自动保存。';\n    }catch(error){showDraftIssue(error);}\n    lastDraftFingerprint=JSON.stringify({project:committedProject(),unexported:dirty});draftReady=true;\n  }\n  /** snapshot：保存单步撤销/尺寸预览所需的正式状态；pan 和选择外壳复制，已验证布局对象按现有不可就地修改约定复用。\n   */\n  function snapshot() {return {board,parts,connections,activeBoardId,selected:selected?{...selected}:null,orientation,zoom,pan:{...pan},snap:$('snap-hint').checked,projectName};}\n  /** restore：恢复快照并刷新界面；项目身份发生变化时释放旧系统句柄，防止把另一项目写回错误文件。\n   */\n  function restore(state) {\n    if(state.projectName!==projectName)projectHandle=null;\n    ({board,parts,connections,selected,orientation,zoom,projectName}=state);activeBoardId=state.activeBoardId??null;pan={...state.pan};$('snap-hint').checked=state.snap;hovered=null;hoveredPart=null;\n    syncControls();render();updateDetails();\n  }\n  /** presetConfig：按每侧轨道数量和分段模式构造完整板型配置，逐轨调用模型的预置分段算法。\n   */\n  function presetConfig(rows,counts,mode=2) {\n    return {rows,railCounts:{...counts},railSegments:Object.fromEntries(['L','R'].map(side=>[side,Array.from({length:counts[side]},()=>M.presetSegments(rows,mode))]))};\n  }\n  /** currentMode：从当前所有电源轨推导统一分段模式；不同轨不一致时标为 custom，而非覆盖各轨配置。\n   */\n  function currentMode() {\n    if(!board.tracks.length)return '2';\n    for(const mode of [1,2,3])if(board.tracks.every(t=>t.segments.join(',')===M.presetSegments(board.rows,mode).join(',')))return String(mode);\n    return 'custom';\n  }\n  /** syncControls：根据当前操作、拖动和忙碌状态统一刷新控件、工具面板及保存权限，并调度草稿/宿主状态通知；应在状态转换后调用。\n   */\n  function syncControls() {\n    dirty=signature()!==savedSignature;\n    $('rows').value=String(board.rows);$('rails').value=board.railCounts.L===board.railCounts.R?String(board.railCounts.L):'custom';$('rail-mode').value=currentMode();\n    $('board-title').textContent = `${board.boards.length} 块面包板 · 每块 ${board.rows} 排`;\n    const same=board.tracks.length&&board.tracks.every(t=>t.segments.join(',')===board.tracks[0].segments.join(','));\n    $('rail-summary').textContent=!board.tracks.length?'当前不显示电源轨。':same?`每轨 ${board.tracks[0].ids.length} 孔；${board.tracks[0].segmentInfo.map(s=>s.holes).join(' + ')} 孔分段导通。`:`共 ${board.tracks.length} 条轨道，采用不同分段；可打开逐轨设置查看。`;\n    for(const node of $('orientation').children){const active=node.dataset.orientation===orientation;node.classList.toggle('active',active);node.setAttribute('aria-pressed',String(active));}\n    const boardDragging=['board','select'].includes(drag?.kind)&&drag.moved,busy=!!frame||!!edit||boardDragging;\n    for(const id of ['rows','rails','rail-settings','reset','new-project','open-project'])$(id).disabled=busy;\n    $('save-project').disabled=boardDragging||!!frame||!!edit&&edit.mode!=='create'||!!edit?.anchor;\n    $('export-image').disabled=$('save-project').disabled;\n    $('save-menu-toggle').disabled=$('save-as').disabled=$('save-project').disabled;\n    if($('save-project').disabled)closeSaveMenu();\n    for(const node of $('tools').querySelectorAll('button'))node.disabled=boardDragging||!!frame||node.dataset.tool!=='select'&&!Object.hasOwn(E.TYPES,node.dataset.tool);\n    for(const node of $('orientation').children)node.disabled=boardDragging;\n    $('rail-mode').disabled=busy||!board.tracks.length;$('undo').disabled=boardDragging||!!frame||!!edit&&edit.mode!=='create'||(!undoState&&!edit?.anchor);\n    $('frame-panel').hidden=!frame;\n    $('project-name').textContent=`${projectName}${dirty?' *':''}`;\n    $('edit-banner').hidden=!edit;\n    $('edit-cancel').textContent=edit?.mode==='create'?'结束 / Esc':'取消 / Esc';\n    $('tool-options').hidden=activeTool==='select';\n    for(const kind of Object.keys(E.TYPES))$(`${kind}-options`).hidden=activeTool!==kind;\n    for(const option of $('port-direction').options)option.textContent=portDirectionLabel(option.value);\n    $('draft-retry').disabled=busy;syncBoardControls();queueDraft();window.CircuitEditor?.notify();\n  }\n  /** syncBoardControls：刷新当前稳定板号、数量及增删/插入权限；拖动或编辑中锁定会改变板序的动作。\n   */\n  function syncBoardControls(){\n    const ids=board.layout.boardIds,busy=!!edit||!!frame||['board','select'].includes(drag?.kind)&&drag.moved;\n    if(!ids.includes(activeBoardId))activeBoardId=null;\n    const picked=!!activeBoardId;\n    $('board-selection').textContent=picked?`已选 ${activeBoardId} · 点击编号外取消选择`:'点击画布上的板号选择板子';\n    $('board-count').textContent=`共 ${ids.length} / ${M.MAX_BOARDS} 块`;\n    $('board-append').disabled=busy||ids.length>=M.MAX_BOARDS;\n    for(const id of ['board-before','board-after'])$(id).disabled=busy||!picked||ids.length>=M.MAX_BOARDS;\n    $('board-delete').disabled=busy||!picked||ids.length===1;\n    $('board-before').textContent=orientation==='horizontal'?'上方插入':'左侧插入';$('board-after').textContent=orientation==='horizontal'?'下方插入':'右侧插入';\n    $('board-order-hint').textContent=`选中后拖动板面${orientation==='horizontal'?'上下':'左右'}换序，松手自动对齐；跨板线随孔位直连。板号聚焦时也可用方向键换序。`;\n  }\n  /** changeBoardOrder：把末尾添加、前后插入、删除转换为新板序计划；删除整板及跨板线必须先列清单确认。\n   */\n  function changeBoardOrder(action){\n    if(edit||frame)return;\n    if(action!=='append'&&!activeBoardId)return;\n    const layout=structuredClone(board.layout),ids=layout.boardIds,index=ids.indexOf(activeBoardId);\n    try{\n      let focus=activeBoardId,title;\n      if(['append','before','after'].includes(action)){\n        if(ids.length>=M.MAX_BOARDS)throw new Error(`最多 ${M.MAX_BOARDS} 块板`);\n        focus=`B${layout.nextBoardNumber++}`;const position=action==='append'?ids.length:index+(action==='after'?1:0);ids.splice(position,0,focus);title=`插入空板 ${focus}（第 ${position+1} 块）`;\n      }else if(action==='delete'){\n        if(ids.length===1)return;ids.splice(index,1);focus=ids[Math.min(index,ids.length-1)];title=`删除板子 ${activeBoardId}`;\n      }else return;\n      const plan=E.planBoardOrder(board,parts,layout);\n      /** commit：执行当前局部上下文中已校验的候选结果，连同选择/撤销/视图刷新一起完成；不是未经验证的通用数据写入口。\n       */\n      const commit=()=>{\n        undoState=snapshot();board=plan.board;parts=plan.parts;connections=plan.connections;activeBoardId=focus;\n        if(selected?.kind==='part'&&!parts.some(p=>p.id===selected.id))selected=null;\n        if(selected?.kind==='parts')selectParts(selected.ids);\n        if(selected?.kind==='hole'&&!board.byId.has(selected.id))selected=null;\n        hovered=null;hoveredPart=null;zoom=1;pan={x:0,y:0};syncControls();render();updateDetails();status(`${title}完成，删除 ${plan.removed.length} 项；可撤销一步恢复。`);\n      };\n      if(plan.removed.length||action==='delete')askConfirm(title,`板内对象随动；以下 ${plan.removed.length} 项将删除，确认后执行，可撤销。取消保持原样。`,plan.removed.map(item=>`${item.part.id} · ${item.part.name}：${item.reason}`),commit);else commit();\n    }catch(error){status(error.message);}\n  }\n  /** commitBoardReorder：整笔提交经过验证的板序计划，保留一步撤销并使对象/跨板线跟随稳定孔位。\n   */\n  function commitBoardReorder(plan,id){\n    if(plan.board.layout.boardIds.join()===board.layout.boardIds.join()){syncControls();render();status('板序未变化；未占用撤销记录。');return;}\n    undoState=snapshot();board=plan.board;parts=plan.parts;connections=plan.connections;activeBoardId=id;selected=null;hovered=null;hoveredPart=null;\n    syncControls();render();updateDetails();status(`已将 ${id} 移到第 ${board.layout.boardIds.indexOf(id)+1} 块，跨板连线已随孔位连接；可撤销一步。`);\n  }\n  /** loadDefault：载入默认板型及示例；record 控制是否把旧状态保留为撤销，新建启动与用户主动载入要区分。\n   */\n  function loadDefault(record=false) {\n    const previous=record?snapshot():null;\n    frame=null;edit=null;projectHandle=null;board=M.buildWorkspace();activeBoardId=null;parts=E.validateParts(board,M.examplesFor(board)).parts;connections=M.connectivity(board,parts);selected=null;hovered=null;orientation='horizontal';zoom=1;pan={x:0,y:0};projectName='未命名电路';if(!record)savedSignature=signature();\n    $('snap-hint').checked=true;undoState=previous;$('config-error').hidden=true;setTool('select');\n    syncControls();render();updateDetails();\n  }\n  /** showError：在指定提示节点展示或清除错误，不通过修改布局来掩盖非法输入。\n   */\n  function showError(id,error) {$(id).hidden=false;$(id).textContent=error.message;status('板型尚未修改，请检查配置。');}\n  /** frameBounds：取原板与候选板框的并集作为预览适配范围，让放大/偏移后的虚线框完整可见；实际裁切边界仍取 frame.plan.frame。\n   */\n  function frameBounds() {\n    const f=frame.plan.frame;\n    return {minX:Math.min(0,f.minX),minY:Math.min(0,f.minY),maxX:Math.max(board.width,f.maxX),maxY:Math.max(board.height,f.maxY)};\n  }\n  /** beginFrame：备份原工程并创建板型变化预览；只进入候选态，用户确认前不删除正式对象。\n   */\n  function beginFrame(input) {\n    try {\n      const plan=M.previewBoardChange(board,input,parts,0);\n      frame={input:plan.board.config,plan,before:snapshot(),fitBounds:null};frame.fitBounds=frameBounds();\n      hovered=null;hoveredPart=null;zoom=1;pan={x:0,y:0};$('config-error').hidden=true;syncControls();updateFramePanel();render();updateDetails();\n      status('拖动新板型框选择保留区域，确认后才会删除红色对象。');return true;\n    }catch(error){showError('config-error',error);syncControls();return false;}\n  }\n  /** moveFrame：将拖动/输入的偏移规范为整数排，重算保留/受影响对象并刷新板框预览。\n   */\n  function moveFrame(value) {\n    if(!frame)return;\n    const offset=Math.max(1-frame.plan.board.rows,Math.min(board.rows-1,Math.round(Number(value)||0)));\n    frame.plan=M.previewBoardChange(board,frame.input,parts,offset);updateFramePanel();render();\n  }\n  /** updateFramePanel：同步尺寸预览参数、受影响对象统计和确认按钮；清单来源于模型候选，不能靠 SVG 是否可见推断。\n   */\n  function updateFramePanel() {\n    const p=frame.plan;$('frame-offset').value=String(p.offsetRows);$('frame-offset').min=String(1-p.board.rows);$('frame-offset').max=String(board.rows-1);\n    const alignment=p.offsetRows>=0?`新第 1 排对齐原第 ${p.offsetRows+1} 排`:`新第 ${1-p.offsetRows} 排对齐原第 1 排`;\n    $('frame-summary').textContent=`新板 ${p.board.rows} 排；${alignment}。保留 ${p.kept.length} 项，删除 ${p.removed.length} 项。`;\n    const list=$('frame-list');list.replaceChildren();\n    for(const part of p.kept)textNode('span',`${part.id} 保留`,list,'frame-item');\n    for(const removed of p.removed)textNode('span',`${removed.part.id} 删除：${removed.outside?'外形或路径超出范围':'引脚无对应孔位'}`,list,'frame-item remove');\n    $('frame-apply').textContent=p.removed.length?`确认并删除 ${p.removed.length} 项`:'确认板型';\n  }\n  /** cancelFrame：恢复板型预览前的正式状态和视图，清空候选框；不消耗此前已完成编辑的撤销。\n   */\n  function cancelFrame() {\n    if(!frame)return;const before=frame.before;frame=null;restore(before);status('已取消板型修改，原板子和对象保持不变。');\n  }\n  /** applyFrame：处理用户确认尺寸：有受影响对象时先列出删除清单，允许取消；无冲突才进入正式提交。\n   */\n  function applyFrame() {\n    if(!frame)return;\n    const warnings=E.newWarnings(board,parts,frame.plan.board,frame.plan.kept);\n    if(warnings.length){askConfirm('新板型产生同网络连接','以下元件引脚将接入同一网络，仍然应用板型？',warnings,commitFrame);return;}\n    commitFrame();\n  }\n  /** commitFrame：把当前已确认的板型和保留对象一起提交，重建导通并记录整笔单步撤销。\n   */\n  function commitFrame(){\n    if(!frame)return;const {plan,before}=frame;undoState=before;frame=null;\n    board=plan.board;parts=plan.kept;connections=plan.connections;\n    if(selected?.kind==='hole')selected=plan.mapping.has(selected.id)?{kind:'hole',id:plan.mapping.get(selected.id)}:null;\n    if(selected?.kind==='part'&&!parts.some(p=>p.id===selected.id))selected=null;\n    if(selected?.kind==='parts')selectParts(selected.ids);\n    hovered=null;hoveredPart=null;zoom=1;pan={x:0,y:0};syncControls();render();updateDetails();status(`板型已应用，保留 ${parts.length} 项、删除 ${plan.removed.length} 项；可撤销一步恢复。`);\n  }\n  /** undo：处理单步撤销；优先取消未完成编辑或预览，不让候选操作消耗较早的已完成编辑记录。\n   */\n  function undo() {\n    if(edit?.mode==='create'){\n      const kind=edit.kind;\n      if(edit.anchor){setTool(kind);editMessage(undoState?'已取消当前第一脚，继续放置；上一次编辑的撤销记录仍保留。':'已取消当前第一脚，继续放置；Esc 结束。');return;}\n      if(!undoState)return;\n      const previous=undoState;undoState=null;restore(previous);setTool(kind);editMessage('已撤销上一步，继续放置；Esc 结束。');return;\n    }\n    if(edit){cancelEdit();return;}if(frame){cancelFrame();return;}if(!undoState)return;\n    const previous=undoState;undoState=null;restore(previous);status('已撤销上一步，板型和对象已恢复。');\n  }\n  /** askConfirm：打开可复用确认窗口并保存确认/取消/第三选项回调；仅在用户明确选择后调用对应动作。\n   */\n  function askConfirm(title,message,items,action,onCancel=null,alternative=null){\n    pendingConfirm=action;pendingCancel=onCancel;pendingAlternative=alternative?.action??null;$('confirm-title').textContent=title;$('confirm-message').textContent=message;\n    $('confirm-alternative').hidden=!alternative;$('confirm-alternative').textContent=alternative?.label??'';\n    $('confirm-ok').textContent=alternative?'保留移动，删除原位冲突项':'确认';\n    $('confirm-list').replaceChildren();items.forEach(item=>textNode('li',item,$('confirm-list')));\n    $('confirm-dialog').showModal();\n  }\n  /** readColor：从色板当前激活项读取颜色，缺省使用固定默认值；不要从按钮 CSS 反解析保存颜色。\n   */\n  function readColor(id){return $(id).querySelector('[aria-checked=\"true\"]').dataset.color;}\n  /** colorPalette：生成可键盘操作的七色单选色板，记录选中值并触发可选属性回调；UI 和存档使用同一规范值。\n   */\n  function colorPalette(target,value=E.DEFAULT_COLOR,onChange=null,label='飞线颜色'){\n    target.replaceChildren();target.classList.add('color-palette');target.setAttribute('role','radiogroup');target.setAttribute('aria-label',label);\n    const selectedColor=E.wireColor(value);\n    /** choose：更新色板单选状态并调用可选变更回调；颜色值仍以受支持的色板条目为准。\n     */\n    const choose=button=>{\n      for(const node of target.children){const active=node===button;node.setAttribute('aria-checked',String(active));node.tabIndex=active?0:-1;}\n      onChange?.();\n    };\n    for(const [name,color] of E.WIRE_COLORS){\n      const button=document.createElement('button');button.type='button';button.className='color-swatch';button.dataset.color=color;button.style.setProperty('--swatch',color);button.style.setProperty('--mark',['橙','黄'].includes(name)?'#243534':'#fff');\n      button.setAttribute('role','radio');button.setAttribute('aria-label',`${name}色`);button.setAttribute('aria-checked',String(color===selectedColor));button.title=`${name}色`;button.tabIndex=color===selectedColor?0:-1;\n      const mark=textNode('span','✓',button);mark.setAttribute('aria-hidden','true');target.appendChild(button);\n      button.addEventListener('click',()=>choose(button));\n      button.addEventListener('keydown',event=>{\n        if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;\n        event.preventDefault();const nodes=[...target.children],index=nodes.indexOf(button);\n        const next=event.key==='Home'?0:event.key==='End'?nodes.length-1:(index+(['ArrowLeft','ArrowUp'].includes(event.key)?-1:1)+nodes.length)%nodes.length;\n        choose(nodes[next]);nodes[next].focus();\n      });\n    }\n  }\n  /** resistorFields：生成 E24 数值/单位选择器；无法映射的旧文本显示为 legacy 项并保留，直到用户主动选择新阻值。\n   */\n  function resistorFields(parent,prefix,value){\n    const group=textNode('div','',parent,'resistance-fields'),numberLabel=textNode('label','阻值（E24）',group),unitLabel=textNode('label','单位',group);\n    const number=document.createElement('select'),unit=document.createElement('select');number.id=`${prefix}-value`;unit.id=`${prefix}-unit`;numberLabel.appendChild(number);unitLabel.appendChild(unit);\n    const parsed=E.parseResistorValue(value);\n    if(!parsed){const option=document.createElement('option');option.value='legacy';option.textContent=`保留原值：${value||'未填写'}`;option.disabled=true;number.appendChild(option);number.dataset.legacyValue=value;}\n    for(const [index,label] of ['0.1～0.91','1～9.1','10～91','100～910'].entries()){\n      const section=document.createElement('optgroup');section.label=label;number.appendChild(section);\n      for(const n of E.RESISTOR_VALUES.slice(index*24,(index+1)*24)){const option=document.createElement('option');option.value=String(n);option.textContent=String(n);section.appendChild(option);}\n    }\n    for(const [label,value] of E.RESISTOR_UNITS){const option=document.createElement('option');option.value=value;option.textContent=label;unit.appendChild(option);}\n    number.value=parsed?String(parsed.number):'legacy';unit.value=parsed?.unit??'Ω';unit.disabled=!parsed;\n    number.addEventListener('change',()=>{unit.disabled=number.value==='legacy';});\n    if(!parsed)textNode('small','旧参数保持原样；选择 E24 数值后更新。',parent,'detail-note');\n  }\n  /** readResistorFields：读取 E24 表单或原样返回 legacy 值，避免仅查看旧工程就改变其参数。\n   */\n  function readResistorFields(prefix){\n    const number=$(`${prefix}-value`);return number.value==='legacy'?number.dataset.legacyValue:E.resistorValue(number.value,$(`${prefix}-unit`).value);\n  }\n  /** portDirectionLabel：把物理引出方向转换为当前横/竖视图的中文描述；只改标签，不改保存的方向语义。\n   */\n  function portDirectionLabel(direction){return orientation==='horizontal'?(direction==='left'?'向上':'向下'):(direction==='left'?'向左':'向右');}\n  /** setTool：切换工具并初始化 create 候选状态、工具按钮和提示；用户参数/换向来自现有表单，不在换工具时统一清空。\n   */\n  function setTool(kind){\n    edit=null;activeTool=kind;hovered=null;hoveredPart=null;activeBoardId=null;\n    for(const node of $('tools').querySelectorAll('button')){const active=node.dataset.tool===kind;node.classList.toggle('active',active);node.setAttribute('aria-pressed',String(active));}\n    $('tool-hint').textContent=kind==='select'?'左键框选，Ctrl 点选；抓住已选对象拖动。短按右键清选，右拖平移。':hints[kind];\n    if(kind!=='select'){\n      edit={mode:'create',kind,anchor:null,candidate:null,plan:null,error:null,target:null};selected=null;\n      editMessage(kind==='chip'?'主区任意列选择排数，芯片自动跨槽；全绿时单击放置，Esc 结束。':E.SINGLE_CLICK_KINDS.includes(kind)?`点击空孔放置${names[kind]}并继续下一个；Esc 结束。`:'请选择第一个空孔；可连续放置，Esc 结束。');\n    }\n    if(board){syncControls();render();updateDetails();}\n  }\n  /** editMessage：统一写入编辑条与状态栏；二极管 create/move/copy 追加空格交换极性提示，错误态与普通提示共用入口。\n   */\n  function editMessage(message,error=false){\n    if(edit?.kind==='diode'&&['create','move','copy'].includes(edit.mode)&&!message.includes('空格交换极性'))message=message.replace(/[。；]$/,'')+'；空格交换极性。';\n    $('edit-message').textContent=message;$('edit-banner').classList.toggle('invalid',error);status(message);\n  }\n  /** cancelEdit：完整退出当前创建、移动、复制或重接预览；直接拖动先释放捕获，已完成对象及上次撤销保持。\n   */\n  function cancelEdit(){\n    if(!edit)return;if(drag?.kind==='part'){suppressClick=true;clearDrag();}const mode=edit.mode;setTool('select');status(mode==='create'?'已结束连续放置，已落下的对象保留。':`已取消${mode==='copy'?'复制':mode==='reconnect'?'重接':'移动'}，原对象保持不变。`);\n  }\n  /** cancelPlacementStep：短按右键的分级取消：已有首孔时只清 anchor/target/候选/错误，保留工具和表单参数；无首孔才完整退出。\n   */\n  function cancelPlacementStep(){\n    if(edit?.mode!=='create')return;\n    if(!edit.anchor){cancelEdit();return;}\n    Object.assign(edit,{anchor:null,target:null,candidate:null,candidates:null,plan:null,error:null});hovered=null;hoveredPart=null;\n    syncControls();paintEdit();editMessage('已取消起点，请重新选择第一个空孔；再次右键或 Esc 结束放置。');\n  }\n  /** beginMove：按当前选择建立单件或整组移动预览；pointerDrag 区分松手放下与 M 键点击放下，实际工程暂不改变。\n   */\n  function beginMove(part,pointerDrag=false){\n    if(!part||frame||edit)return;\n    hovered=null;hoveredPart=null;\n    const ids=selectedIds(),group=ids.length>1;if(group)part=moveAnchor(part.id);\n    activeTool='select';edit={mode:group?'group':'move',kind:part.kind,original:part,ids:group?ids:null,originals:group?parts.filter(p=>ids.includes(p.id)):null,anchor:null,target:null,candidate:null,plan:null,error:null,pointerDrag};\n    if(group){editMessage(`移动 ${ids.length} 项，以 ${part.id} 第 1 脚定位；${pointerDrag?'松开左键':'点击目标孔'}放下，Esc 取消。`);syncControls();render();updateDetails();return;}\n    editMessage(pointerDrag?`拖动 ${part.id}：松开左键放下，无效位置返回原位；Esc 取消。`:`移动 ${part.id}：点击目标孔放置 ${part.pins[0][0]} 脚，其他引脚保持相对位置；飞线不跟随。`);syncControls();render();updateDetails();\n  }\n  /** flipSelectedPart：对已放置且允许换向的单件建立翻转计划；新增同网脚对先确认，提交时整笔保存撤销。\n   */\n  function flipSelectedPart(){\n    if(edit||frame||selected?.kind!=='part')return;\n    const current=parts.find(p=>p.id===selected.id);if(!current||!E.FLIPPABLE_KINDS.includes(current.kind))return;\n    try{\n      const plan=E.planEdit(board,parts,E.flipPart(board,current),current.id);\n      const description={diode:'两端极性对调',transistor:'中脚位置不变，外侧脚交换',chip:'原位旋转 180°，物理脚号与脚名跟随',port:'转向对侧，插孔不变'}[current.kind];\n      /** commit：执行当前局部上下文中已校验的候选结果，连同选择/撤销/视图刷新一起完成；不是未经验证的通用数据写入口。\n       */\n      const commit=()=>{undoState=snapshot();parts=plan.parts;connections=plan.connections;syncControls();render();updateDetails();status(`已换向 ${current.id}，${description}；可撤销。`);};\n      if(plan.warnings.length)askConfirm('换向后元件引脚接入同一网络','换向会改变引脚连接，确认后应用；取消保持原样。',plan.warnings,commit);else commit();\n    }catch(error){status(error.message);}\n  }\n  /** canFlipPlacement：判断当前 create/move/copy 对象是否支持候选换向；重接及整组状态不套用单件换向规则。\n   */\n  function canFlipPlacement(){return edit&&['create','move','copy'].includes(edit.mode)&&E.FLIPPABLE_KINDS.includes(edit.kind);}\n  /** flipPlacement：只改变候选方向或表单换向开关，并用当前目标重新预览；空格不能同时触发单击放置。\n   */\n  function flipPlacement(){\n    if(!canFlipPlacement()||frame)return;\n    if(edit.mode!=='create')edit.flip=!edit.flip;\n    else if(edit.kind==='port')$('port-direction').value=$('port-direction').value==='left'?'right':'left';\n    else{const button=$(`${edit.kind}-reverse`);button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));}\n    const hole=board.byId.get(edit.target);\n    if(hole)previewEdit(hole);else editMessage(`${names[edit.kind]}方向已切换；移动到孔位查看候选，单击后才放置。`);\n    paintEdit();\n  }\n  /** beginCopy：建立单对象复制预览，保留原对象及其参数；只有后续有效落点提交时才分配/写入副本。\n   */\n  function beginCopy(part){\n    if(!part||frame||edit)return;\n    hovered=null;hoveredPart=null;activeTool='select';\n    edit={mode:'copy',kind:part.kind,original:part,anchor:null,target:null,candidate:null,plan:null,error:null};\n    editMessage(`复制 ${part.id}：以第一脚选择新位置，保留参数、脚名和排列；Esc 取消。`);syncControls();render();updateDetails();\n  }\n  /** beginReconnect：为两脚元件/飞线建立单脚重接预览，另一端固定；只在合法索引和非忙碌状态下进入。\n   */\n  function beginReconnect(part,index){\n    if(!part||!E.TWO_PIN_KINDS.includes(part.kind)||frame||edit)return;\n    hovered=null;hoveredPart=null;activeTool='select';\n    edit={mode:'reconnect',kind:part.kind,original:part,pinIndex:index,anchor:null,target:null,candidate:null,plan:null,error:null};\n    editMessage(`重接 ${part.id} 第 ${index+1} 脚（${part.pins[index][0]}）：另一脚保持原孔，点击新孔落下；Esc 取消。`);syncControls();render();updateDetails();\n  }\n  /** previewEdit：按工具/模式生成候选元件或整组计划，捕获错误供红色预览；允许芯片从任意主区列吸附槽边。\n   * 正式 parts 和 undoState 只能由点击确认流程更新，首点/悬停/空格预览不能直接提交。\n   */\n  function previewEdit(hole){\n    if(!edit)return;\n    edit.target=hole?.id??null;edit.candidate=null;edit.candidates=null;edit.plan=null;edit.error=null;\n    if(!hole){editMessage(edit.pointerDrag?'当前位置无可用孔位，松开左键返回原位；Esc 可取消。':'请移动到实际孔位；Esc 可取消。');return;}\n    try{\n      const anchor=edit.kind==='chip'?E.chipAnchor(board,hole.id,edit.mode==='create'?false:edit.original.reverse):hole;\n      if(edit.mode==='group'){\n        edit.candidates=E.moveParts(board,edit.originals,edit.original.id,anchor.id);edit.plan=E.planMoveParts(board,parts,edit.candidates,{resolveConflicts:true});\n        editMessage(`${edit.ids.length} 项可整体移动${edit.plan.conflicts.length?`，与 ${edit.plan.conflicts.length} 个原位对象占孔冲突，放下后选择保留哪一侧`:''}${edit.plan.warnings.length?'，有同网络警告':''}；${edit.pointerDrag?'松开左键':'点击'}放下，Esc 取消。`);return;\n      }\n      if(edit.mode==='move')edit.candidate=E.movePart(board,edit.original,anchor.id);\n      else if(edit.mode==='copy')edit.candidate=E.copyPart(board,parts,edit.original,anchor.id);\n      else if(edit.mode==='reconnect')edit.candidate=E.reconnectPart(board,edit.original,edit.pinIndex,hole.id);\n      else if(edit.kind==='chip'){\n        const count=Number($('chip-count').value),reverse=$('chip-reverse').getAttribute('aria-pressed')==='true';\n        edit.candidate={id:E.nextId(parts,'chip'),kind:'chip',name:'芯片',value:`DIP-${count}`,reverse,pins:E.chipPins(board,anchor.row,count,reverse,M.boardIdOf(anchor.id))};\n      }else if(edit.kind==='transistor'){\n        edit.candidate={id:E.nextId(parts,'transistor'),kind:'transistor',name:'三极管',value:$('transistor-value').value,reverse:false,pins:E.transistorPins(board,hole.id)};\n        if($('transistor-reverse').getAttribute('aria-pressed')==='true')edit.candidate=E.flipTransistor(board,edit.candidate);\n      }else if(edit.kind==='port'){\n        edit.candidate={id:E.nextId(parts,'port'),kind:'port',name:$('port-name').value,value:'',direction:$('port-direction').value,color:readColor('port-color'),pins:[['1',hole.id]]};\n      }else if(edit.anchor){\n        edit.candidate={id:E.nextId(parts,edit.kind),kind:edit.kind,name:names[edit.kind],value:edit.kind==='resistor'?readResistorFields('resistor'):['capacitor','diode'].includes(edit.kind)?$(`${edit.kind}-value`).value:'',pins:[[edit.kind==='wire'?'起点':'1',edit.anchor],[edit.kind==='wire'?'终点':'2',hole.id]],...(edit.kind==='wire'?{color:readColor('wire-color')}:{})};\n        if(edit.kind==='diode'&&$('diode-reverse').getAttribute('aria-pressed')==='true')edit.candidate=E.flipPart(board,edit.candidate);\n      }else{\n        if(connections.occupied.has(hole.id))throw new Error(`${hole.id} 已被 ${connections.occupied.get(hole.id).part} 占用`);\n        editMessage(`${hole.id} 可放置第一脚，点击确定。`);return;\n      }\n      if(edit.mode!=='create'&&edit.flip)edit.candidate=E.flipPart(board,edit.candidate);\n      edit.plan=E.planEdit(board,parts,edit.candidate,['move','reconnect'].includes(edit.mode)?edit.original.id:null);\n      const drop=edit.pointerDrag?'松开左键':'单击';\n      editMessage(edit.plan.warnings.length?`${edit.plan.warnings.length} 项同网络警告；${drop}后可确认继续。`:edit.kind==='chip'?`${edit.candidate.id} 已跨槽对齐，1 脚 ${edit.candidate.pins[0][1]}；全绿可${drop}放置，Esc 取消。`:`${edit.candidate.id} 可以放置；${drop}放下，Esc 取消。`);\n    }catch(error){edit.error=error.message;editMessage(error.message,true);}\n  }\n  /** clickEdit：两点绘制先记录首孔，再提交有效候选；单击型和移动/复制走同一验证结果。\n   * 提交前保存撤销，新出现的同网脚对先询问；连续创建完成后重置为同工具无首孔状态，保留参数和方向。\n   */\n  function clickEdit(hole){\n    previewEdit(hole);paintEdit();if(!hole||edit.error)return;\n    if(edit.mode==='group'){\n      const plan=edit.plan,ids=edit.ids;if(!plan)return;\n      if(JSON.stringify(plan.moved)===JSON.stringify(edit.originals)){cancelEdit();return;}\n      /** commit：执行当前局部上下文中已校验的候选结果，连同选择/撤销/视图刷新一起完成；不是未经验证的通用数据写入口。\n       */\n      const commit=result=>{undoState=snapshot();parts=result.parts;connections=result.c &!previous.moved&&!cancelled&&edit?.mode==='create'){cancelPlacementStep();return;}\n    if(previous.kind==='pan'&&previous.button===2&&!previous.moved&&!cancelled&&!edit&&!frame&&selectedIds().length){selected=null;hovered=null;hoveredPart=null;syncControls();render();updateDetails();status('已清除元件选择。');return;}\n    if(previous.kind!=='part'||!previous.moved)return;\n    if(cancelled){cancelEdit();return;}\n    previewEdit(hole);\n    if(!hole||edit.error||!edit.plan){const reason=edit.error,label=edit.mode==='group'?`${edit.ids.length} 项`:previous.original.id;cancelEdit();status(`无法放下，${reason??'目标位置没有可用孔位'}；${label} 已回到原位。`);return;}\n    clickEdit(hole);\n  }\n  canvas.addEventListener('pointerup',event=>endDrag(event));\n  canvas.addEventListener('pointercancel',event=>endDrag(event,true));\n  canvas.addEventListener('lostpointercapture',event=>endDrag(event,true));\n  canvas.addEventListener('contextmenu',event=>event.preventDefault());\n  window.addEventListener('blur',()=>{if(['part','board','select'].includes(drag?.kind))endDrag({pointerId:drag.pointerId},true);else clearDrag();});\n  canvas.addEventListener('wheel',event=>{\n    event.preventDefault();if(drag)return;\n    const before=view(),point=canvasPoint(event),oldZoom=zoom;zoom=Math.min(3,Math.max(.7,zoom*(event.deltaY\u003c0?1.12:1/1.12)));\n    const ratio=zoom/oldZoom,after=view();pan.x+=(point.x-before.tx)*(1-ratio)+before.tx-after.tx;pan.y+=(point.y-before.ty)*(1-ratio)+before.ty-after.ty;render();\n  },{passive:false});\n  /* 控件绑定：工具、板型和轨道表单调用上方状态入口，不在事件内另写一套电气规则。 */\n$('tools').addEventListener('click',event=>{\n    const button=event.target.closest('[data-tool]');if(!button||button.disabled)return;setTool(button.dataset.tool);\n  });\n  $('orientation').addEventListener('click',event=>{\n    const button=event.target.closest('[data-orientation]');if(!button)return;orientation=button.dataset.orientation;hovered=null;hoveredPart=null;zoom=1;pan={x:0,y:0};syncControls();render();updateDetails();\n    status(`已切换${orientation==='vertical'?'纵向':'横向'}显示，孔号和连接关系保持不变。`);\n  });\n  $('rows').addEventListener('change',()=>{\n    const rows=Number($('rows').value),mode=currentMode();\n    const config=mode==='custom'?{...board.config,rows}:presetConfig(rows,board.railCounts,Number(mode));beginFrame(config);\n  });\n  $('rails').addEventListener('change',()=>{\n    const value=$('rails').value;if(value==='custom'){syncControls();openRailDialog();return;}\n    const count=Number(value),config=structuredClone(board.config);\n    for(const side of ['L','R']){config.railCounts[side]=count;config.railSegments[side]=Array.from({length:count},(_,i)=>board.config.railSegments[side][i]??M.presetSegments(board.rows,2));}\n    beginFrame(config);\n  });\n  $('rail-mode').addEventListener('change',()=>{\n    const mode=$('rail-mode').value;if(mode==='custom'){syncControls();openRailDialog();return;}beginFrame(presetConfig(board.rows,board.railCounts,Number(mode)));\n  });\n  $('snap-hint').addEventListener('change',()=>{hovered=null;hoveredPart=null;paintHighlights();});\n  document.addEventListener('click',event=>{\n    if(!activeBoardId||event.target.closest('[data-board-select],#board-controls,dialog'))return;\n    activeBoardId=null;syncBoardControls();render();\n  });\n  for(const action of ['append','before','after','delete'])$(`board-${action}`).addEventListener('click',()=>changeBoardOrder(action));\n  $('rail-settings').addEventListener('click',openRailDialog);\n  for(const id of ['rail-close','rail-cancel'])$(id).addEventListener('click',()=>$('rail-dialog').close());\n  for(const id of ['rail-left-count','rail-right-count','config-rows'])$(id).addEventListener('change',()=>{readRailFields();drawRailFields();});\n  for(const button of document.querySelectorAll('[data-rail-preset]'))button.addEventListener('click',()=>{\n    readRailFields();const value=M.presetSegments(Number($('config-rows').value),Number(button.dataset.railPreset)).join(',');\n    for(const side of s('已载入可编辑的默认示例。');}));\n  $('new-project').addEventListener('click',()=>askConfirm('新建空板','清空所有板上的对象，保留板数、板序和统一板型；可撤销一步恢复。',[],()=>{\n    undoState=snapshot();projectHandle=null;parts=[];connections=M.connectivity(board);selected=null;projectName='未命名电路';setTool('select');syncControls();render();updateDetails();status('空板已就绪，选择飞线、电阻或芯片工具开始放置。');\n  }));\n  $('edit-cancel').addEventListener('click',event=>{event.stopPropagation();cancelEdit();});\n  /** completeConfirmation：先关闭确认窗口并清空回调引用，再执行选中的动作，防止重复提交或重入。\n   */\n  function completeConfirmation(action){pendingConfirm=null;pendingCancel=null;pendingAlternative=null;$('confirm-dialog').close();action?.();}\n  $('confirm-ok').addEventListener('click',()=>completeConfirmation(pendingConfirm));\n  $('confirm-alternative').addEventListener('click',()=>completeConfirmation(pendingAlternative));\n  /** cancelConfirmation：清空确认回调；有业务取消动作则调用，直接拖动确认取消时恢复原对象。\n   */\n  function cancelConfirmation(){const action=pendingCancel;pendingConfirm=null;pendingCancel=null;pendingAlternative=null;if(action)action();else if(edit?.pointerDrag)cancelEdit();}\n  $('confirm-cancel').addEventListener('click',()=>{$('confirm-dialog').close();cancelConfirmation();});\n  $('confirm-dialog').addEventListener('cancel',cancelConfirmation);\n  colorPalette($('wire-color'),E.DEFAULT_COLOR,()=>{if(edit){previewEdit(board.byId.get(edit.target));paintEdit();}});resistorFields($('resistor-options'),'resistor','1 kΩ');\n  for(const id of ['resistor-value','resistor-unit','chip-count','capacitor-value','diode-value','transistor-value','port-name','port-direction'])$(id).addEventListener('input',()=>{if(edit){previewEdit(board.byId.get(edit.target));paintEdit();}});\n  for(const kind of ['transistor','diode','chip'])$(`${kind}-reverse`).addEventListener('click',()=>{\n    const button=$(`${kind}-reverse`);button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));if(edit){previewEdit(board.byId.get(edit.target));paintEdit();}\n  });\n  colorPalette($('port-color'),E.DEFAULT_COLOR,()=>{if(edit){previewEdit(board.byId.get(edit.target));paintEdit();}},'引出线颜色');\n  $('save-project').addEventListener('click',saveProject);\n  $('save-menu-toggle').addEventListener('click',()=>{const opening=$('save-menu').hidden;closeSaveMenu();if(opening){$('save-menu').hidden=false;$('save-menu-toggle').setAttribute('aria-expanded','true');$('save-as').focus();}});\n  $('save-as').addEventListener('click',()=>beginProjectSave(true));\n  $('save-menu-toggle').addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();$('save-menu').hidden=false;$('save-menu-toggle').setAttribute('aria-expanded','true');$('save-as').focus();}});\n  document.addEventListener('click',event=>{if(!event.target.closest('.save-split'))closeSaveMenu();});\n  $('save-form').addEventListener('submit',event=>{event.preventDefault();performProjectSave();});\n  $('save-method').addEventListener('change',saveMethodChanged);\n  $('save-cancel').addEventListener('click',()=>{$('save-dialog').close();finishSwitchSave(false);});\n  $('save-dialog').addEventListener('cancel',event=>{if(savingProject)event.preventDefault();else finishSwitchSave(false);});\n  $('open-project').addEventListener('click',()=>$('project-file').click());\n  $('export-image').addEventListener('click',openImageExport);\n  $('export-all').addEventListener('click',()=>exportImages('all'));\n  $('export-boards').addEventListener('click',()=>exportImages('boards'));\n  $('export-cancel').addEventListener('click',()=>$('export-dialog').close());\n  $('export-dialog').addEventListener('cancel',event=>{if(exportingImage)event.preventDefault();});\n  $('project-file').addEventListener('change',()=>openProject($('project-file').files[0]));\n  $('draft-retry').addEventListener('click',()=>{\n    if(['invalid','conflict'].includes(draftIssue?.code))askConfirm('重新写入本地草稿','当前画面将替换浏览器中的草稿。其他窗口的内容或原缓存可能被覆盖，请先导出需要保留的项目。',[],()=>flushDraft(true));\n    else{draftIssue=null;flushDraft();}\n  });\n  window.addEventListener('storage',event=>{if(draftReady&&event.key===D.KEY&&draftStore&&event.newValue!==draftStore.observedRaw())showDraftIssue({code:'conflict',message:'其他窗口已更新草稿，本页暂停写入；刷新可恢复另一窗口的草稿'});});\n  window.addEventListener('pagehide',()=>flushDraft());\n  window.addEventListener('beforeunload',event=>{document.activeElement?.blur();flushDraft();if(dirty||savingProject){event.preventDefault();event.returnValue='';}});\n  /* 全局快捷键：先排除模态窗口、输入法和文本输入；再分派 Esc/M/C/Del/Space/Ctrl+Z，保留原生文本操作。 */\nwindow.addEventListener('keydown',event=>{\n    if($('rail-dialog').open||$('confirm-dialog').open||$('export-dialog').open||$('save-dialog').open)return;\n    if(event.key==='Escape'&&!$('save-menu').hidden){event.preventDefault();closeSaveMenu();$('save-menu-toggle').focus();return;}\n    if(['board','select'].includes(drag?.kind)&&(event.key==='Escape'||(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z')){event.preventDefault();endDrag({pointerId:drag.pointerId},true);return;}\n    const typing=event.isComposing||event.target.closest('input,textarea,select,[contenteditable]:not([contenteditable=\"false\"])');\n    if(drag?.kind==='select')return;\n    if(event.key===' '&&!event.defaultPrevented&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!typing&&canFlipPlacement()&&(!event.target.closest('button,summary')||event.target.closest('[data-tool]')||edit.target)){\n      event.preventDefault();if(!event.repeat)flipPlacement();return;\n    }\n    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!event.shiftKey&&!typing){event.preventDefault();undo();return;}\n    if(event.key==='Delete'&&!typing){event.preventDefault();deleteSelected();return;}\n    if(event.key===' '&&!event.defaultPrevented&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!typing&&!event.target.closest('button,summary')&&!edit&&!frame&&selected?.kind==='part'&&E.FLIPPABLE_KINDS.includes(parts.find(p=>p.id===selected.id)?.kind)){\n      ev
