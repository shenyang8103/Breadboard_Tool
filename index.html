ace-sliding,.canvas.trace-sliding *{cursor:grabbing!important}\n\n.trace.reference.trace-interactive .conductor-hit{pointer-events:stroke!important}\n#decision-dialog{width:min(680px,calc(100vw - 32px))}.decision-list{max-height:min(340px,45vh);overflow:auto;border:1px solid var(--border);border-radius:6px;padding:12px 16px;background:#f8faf7}.decision-list h3{font-size:12px;margin:6px 0 10px}.decision-list ul{padding-left:20px;margin:8px 0 16px}.decision-list li{font-size:12px;line-height:1.7;overflow-wrap:anywhere}.decision-list details{font-size:12px}.decision-list summary{cursor:pointer;padding:5px 0}#decision-dialog .dialog-actions{flex-wrap:wrap}#decision-dialog button{font-size:12px}.decision-list:empty{display:none}\n.resize-panel{border:1px solid #a9cbd5;background:#f0f8fa;border-radius:7px;padding:10px;margin:10px 0}.resize-panel strong{font-size:12px;color:#346c7f}.resize-panel p{font-size:11px;line-height:1.6;margin:6px 0}.resize-preview{opacity:1}.resize-frame{fill:#67c1dc10;stroke:#42b5da;stroke-width:2;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}.resize-new-hole{fill:#d0e9ed66;stroke:#6aa4b699;stroke-width:1}.resize-label{font-size:10px;fill:#176a91;paint-order:stroke;stroke:#f5fcff;stroke-width:3;pointer-events:none}.resize-items{padding-left:15px;font-size:11px;line-height:1.7;overflow-wrap:anywhere}.resize-items .affected{color:#b74336;font-weight:600}.component.resize-affected .part-body{stroke:#ff6555;stroke-width:3}.component.resize-affected .part-pin{stroke:#ff6555!important}.trace.resize-affected .outer,.wire.resize-affected .outer{stroke:#ff6555!important;stroke-width:8}.resize-affected .part-label{fill:#b52c24}.canvas.resize-dragging,.canvas.resize-dragging *{cursor:grabbing!important}\n\n.draft-panel[data-issue]{border-color:#dbad76}.draft-panel[data-issue] #draft-state{color:#a6532e}.draft-panel button{font-size:11px}#image-options>label:not(.check),#netlist-options>label{display:grid;gap:7px;font-size:12px;color:#63796a;margin-top:18px}#export-state{font-size:12px;color:#a6532e;min-height:18px}#export-dialog .check{font-size:12px}\n\n.brand .switch-tool{display:inline-block;margin-left:9px;padding:1px 0;border:0;border-radius:2px;background:transparent;color:#849087;font-size:10px;font-weight:400;letter-spacing:0;vertical-align:2px}.brand .switch-tool:hover{color:#4e7768;background:transparent;text-decoration:underline}.brand .switch-tool:focus-visible{outline:2px solid #80c9bb;outline-offset:3px}\n\n.brand-mark.perfboard-mark{display:grid;place-items:center;line-height:0}.perfboard-mark svg{display:block;width:76%;height:76%}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003c!-- 顶部：16 个白色圆环区分洞洞板；保存身份仍在本工具，不与面包板共享句柄。 -->\n\u003cheader class=\"app-header\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark perfboard-mark\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003ccircle cx=\"7\" cy=\"7\" r=\"1.9\"/>\u003ccircle cx=\"13\" cy=\"7\" r=\"1.9\"/>\u003ccircle cx=\"19\" cy=\"7\" r=\"1.9\"/>\u003ccircle cx=\"25\" cy=\"7\" r=\"1.9\"/>\u003ccircle cx=\"7\" cy=\"13\" r=\"1.9\"/>\u003ccircle cx=\"13\" cy=\"13\" r=\"1.9\"/>\u003ccircle cx=\"19\" cy=\"13\" r=\"1.9\"/>\u003ccircle cx=\"25\" cy=\"13\" r=\"1.9\"/>\u003ccircle cx=\"7\" cy=\"19\" r=\"1.9\"/>\u003ccircle cx=\"13\" cy=\"19\" r=\"1.9\"/>\u003ccircle cx=\"19\" cy=\"19\" r=\"1.9\"/>\u003ccircle cx=\"25\" cy=\"19\" r=\"1.9\"/>\u003ccircle cx=\"7\" cy=\"25\" r=\"1.9\"/>\u003ccircle cx=\"13\" cy=\"25\" r=\"1.9\"/>\u003ccircle cx=\"19\" cy=\"25\" r=\"1.9\"/>\u003ccircle cx=\"25\" cy=\"25\" r=\"1.9\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cstrong>洞洞板工作台\u003c/strong>\u003cbutton id=\"switch-tool\" class=\"switch-tool\" hidden>\u003c/button>\u003csmall>让每一个连接清楚可见\u003c/small>\u003c/div>\u003c/div>\n    \u003cdiv class=\"project-title\">\u003cspan id=\"project-name\">双面连接示例\u003c/span>\u003cspan class=\"preview-badge\">本地布局 · 离线版\u003c/span>\u003c/div>\n    \u003cdiv class=\"header-actions\">\u003cbutton id=\"blank\">新建空板\u003c/button>\u003cbutton id=\"reset\">载入示例\u003c/button>\u003cbutton id=\"undo\" disabled>撤销一步\u003c/button>\u003cbutton id=\"open-project\">打开项目\u003c/button>\u003cbutton id=\"export-image\">导出图片\u003c/button>\u003cbutton id=\"export-netlist\">导出网表\u003c/button>\u003cbutton id=\"save-as\">另存为\u003c/button>\u003cbutton id=\"save-project\" class=\"primary\">保存项目\u003c/button>\u003cinput id=\"project-file\" type=\"file\" accept=\".perfboard.json,.json,application/json\" hidden>\u003c/div>\n  \u003c/header>\n  \u003cmain class=\"app-layout\">\n    \u003c!-- 左栏工具/尺寸/双面：查看面与镜像不改变存档物理孔号，尺寸变更先走候选。 -->\n\u003caside class=\"panel left-panel\" aria-label=\"工具与板型\">\n      \u003csection>\n        \u003cdiv class=\"section-heading\">\u003ch2>元件与工具\u003c/h2>\u003cspan>基础编辑\u003c/span>\u003c/div>\n        \u003cdiv class=\"tool-grid\">\n          \u003cbutton class=\"tool active\" data-tool=\"select\" aria-pressed=\"true\">\u003cb aria-hidden=\"true\">↖\u003c/b>选择查看\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"wire\" aria-pressed=\"false\">\u003cb class=\"wire-icon\" aria-hidden=\"true\">╱\u003c/b>飞线\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"trace\" aria-pressed=\"false\">\u003cb aria-hidden=\"true\">└\u003c/b>焊锡走线\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"resistor\" aria-pressed=\"false\">\u003cb class=\"resistor-icon\" aria-hidden=\"true\">\u003c/b>电阻\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"capacitor\" aria-pressed=\"false\">\u003cb class=\"component-icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 22\">\u003cpath d=\"M8 12v8m8-8v8\" fill=\"none\" stroke=\"#77887e\" stroke-width=\"1.8\"/>\u003cellipse cx=\"12\" cy=\"8.5\" rx=\"8\" ry=\"6.5\" fill=\"#b77843\" stroke=\"#8d582d\" stroke-width=\"1.2\"/>\u003c/svg>\u003c/b>电容\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"diode\" aria-pressed=\"false\">\u003cb class=\"component-icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 22\">\u003cpath d=\"M1 11h22\" stroke=\"#77887e\" stroke-width=\"1.8\"/>\u003crect x=\"5\" y=\"6\" width=\"14\" height=\"10\" rx=\"2\" fill=\"#6a5550\" stroke=\"#493e38\" stroke-width=\"1\"/>\u003cpath d=\"M16 6.5v9\" stroke=\"#e3d5c7\" stroke-width=\"2.3\"/>\u003c/svg>\u003c/b>二极管\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"transistor\" aria-pressed=\"false\">\u003cb aria-hidden=\"true\">◖\u003c/b>三极管\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"chip\" aria-pressed=\"false\">\u003cb aria-hidden=\"true\">▥\u003c/b>芯片\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"custom\" aria-pressed=\"false\">\u003cb aria-hidden=\"true\">▭\u003c/b>自定义\u003c/button>\n          \u003cbutton class=\"tool\" data-tool=\"port\" aria-pressed=\"false\">\u003cb aria-hidden=\"true\">⟶\u003c/b>引出线\u003c/button>\n        \u003c/div>\n        \u003cp class=\"detail-note\" id=\"tool-hint\">悬停孔位查看网络；点击元件或线身选择。M 移动，Del 删除，Ctrl+Z 撤销一步。\u003c/p>\n        \u003cdiv id=\"tool-options\" class=\"tool-options\" hidden>\u003clabel>名称\u003cinput id=\"new-name\" value=\"电阻\" maxlength=\"120\">\u003c/label>\u003clabel id=\"new-value-label\">参数\u003cinput id=\"new-value\" maxlength=\"120\">\u003c/label>\u003cdiv id=\"resistor-options\" class=\"two-fields\">\u003clabel>阻值（E24）\u003cselect id=\"resistor-number\">\u003c/select>\u003c/label>\u003clabel>单位\u003cselect id=\"resistor-unit\">\u003coption value=\"Ω\">欧 Ω\u003c/option>\u003coption value=\"kΩ\" selected>千欧 kΩ\u003c/option>\u003coption value=\"MΩ\">兆欧 MΩ\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel id=\"chip-options\">DIP 引脚数\u003cselect id=\"chip-count\">\u003coption>4\u003c/option>\u003coption>6\u003c/option>\u003coption selected>8\u003c/option>\u003coption>10\u003c/option>\u003coption>12\u003c/option>\u003coption>14\u003c/option>\u003coption>16\u003c/option>\u003coption>18\u003c/option>\u003coption>20\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"custom-options\" class=\"custom-options\">\u003cdiv class=\"two-fields\">\u003clabel>本体宽（孔距）\u003cinput id=\"custom-width\" type=\"number\" min=\"1\" max=\"59\" value=\"4\">\u003c/label>\u003clabel>本体高（孔距）\u003cinput id=\"custom-height\" type=\"number\" min=\"1\" max=\"59\" value=\"5\">\u003c/label>\u003c/div>\u003cdiv class=\"two-fields\">\u003clabel>引脚数\u003cinput id=\"custom-count\" type=\"number\" min=\"1\" max=\"40\" value=\"8\">\u003c/label>\u003clabel>初始排布\u003cselect id=\"custom-layout\">\u003coption value=\"dual\">双排\u003c/option>\u003coption value=\"single\">单排\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"detail-note\">宽高以孔距计，4 个孔距跨 5 个孔中心。单排容量为高 + 1，双排为 2 ×（高 + 1）。脚位可在放下后微调。\u003c/p>\u003c/div>\u003cp id=\"connection-note\" class=\"detail-note\">\u003c/p>\u003c/div>\n      \u003c/section>\n      \u003csection class=\"separated\">\n        \u003cdiv class=\"section-heading\">\u003ch2>板型设置\u003c/h2>\u003cspan>单块 · 100 mil\u003c/span>\u003c/div>\n        \u003cdiv class=\"two-fields\">\u003clabel>列数\u003cselect id=\"columns\" aria-label=\"列数\">\u003c/select>\u003c/label>\u003clabel>行数\u003cselect id=\"rows\" aria-label=\"行数\">\u003c/select>\u003c/label>\u003c/div>\n        \u003cp class=\"dimension\" id=\"dimensions\">\u003c/p>\n        \u003cdiv id=\"resize-panel\" class=\"resize-panel\" hidden>\u003cstrong>板型框预览\u003c/strong>\u003cp id=\"resize-summary\">\u003c/p>\u003cp>虚线框内左拖定位，松手继续预览；单击确定。红色内容会删除，Esc 取消。\u003c/p>\u003cdiv class=\"selection-actions\">\u003cbutton id=\"resize-cancel\">取消预览\u003c/button>\u003cbutton id=\"resize-apply\" class=\"primary\">确定板型\u003c/button>\u003c/div>\u003c/div>\n        \u003clabel class=\"field-label\">显示方向\u003c/label>\n        \u003cdiv class=\"segmented\" id=\"orientation\">\u003cbutton data-orientation=\"horizontal\" class=\"active\" aria-pressed=\"true\">横向\u003c/button>\u003cbutton data-orientation=\"vertical\" aria-pressed=\"false\">纵向\u003c/button>\u003c/div>\n        \u003cp class=\"detail-note\">尺寸确认后按实际宽高校正方向，不旋转布局；方形保持原状态。点击方向按钮可手动旋转。\u003c/p>\n        \u003cp class=\"detail-note\" id=\"example-note\">每五格白线仅辅助定位。放大、缩小均先预览，虚线框可左拖定位；单击确定后，如有框外内容再确认删除。\u003c/p>\n      \u003c/section>\n      \u003csection class=\"separated\">\n        \u003cdiv class=\"section-heading\">\u003ch2>双面显示\u003c/h2>\u003cspan id=\"side-caption\">元件面\u003c/span>\u003c/div>\n        \u003clabel class=\"check\">\u003cinput id=\"mirror\" type=\"checkbox\" disabled>背面镜像\u003c/label>\n        \u003cp class=\"detail-note mirror-help\" id=\"mirror-help\">设计时背面默认不镜像；背面图片导出将默认镜像。\u003c/p>\n        \u003clabel class=\"check\">\u003cinput id=\"reference\" type=\"checkbox\" checked>淡显另一面\u003c/label>\n        \u003clabel class=\"range-label\" for=\"opacity\">淡显强度 \u003coutput id=\"opacity-value\">40%\u003c/output>\u003c/label>\n        \u003cinput id=\"opacity\" type=\"range\" min=\"8\" max=\"70\" step=\"2\" value=\"40\">\n        \u003cp class=\"detail-note\" id=\"reference-help\">正面淡显背面的焊锡走线和飞线。\u003c/p>\n      \u003c/section>\n      \u003csection id=\"draft-panel\" class=\"separated draft-panel\">\u003cdiv class=\"section-heading\">\u003ch2>本地草稿\u003c/h2>\u003cspan>自动恢复\u003c/span>\u003c/div>\u003cp id=\"draft-state\" role=\"status\" class=\"detail-note\">正在读取本地草稿…\u003c/p>\u003cbutton id=\"draft-retry\" hidden>重试草稿\u003c/button>\u003cp class=\"detail-note\">只恢复已完成的编辑；项目文件可另存备份。不同浏览器、地址或移动离线文件后，草稿可能不互通。\u003c/p>\u003c/section>\n      \u003cdiv class=\"scope-note\">\u003cstrong>冲突与缩板按清单处理\u003c/strong>\u003cp>移动、复制、旋转遇到实体占孔冲突，放下后选择保留哪一侧。调整尺寸先拖动虚线框预览，放大偏移也会检查框外内容；确认后可一步撤销。\u003c/p>\u003c/div>\n    \u003c/aside>\n    \u003c!-- 场景正式实体与 preview/手柄分层；参考面可见不意味着额外占孔，电气连接只取实际导体图。 -->\n\u003csection class=\"workspace\" aria-label=\"洞洞板画布\">\n      \u003cdiv class=\"canvas-toolbar\">\u003cdiv class=\"view-caption\">\u003cspan class=\"live-dot\">\u003c/span>\u003cstrong id=\"view-caption\">正面 · 元件面\u003c/strong>\u003cdiv class=\"segmented view-side\" id=\"side\" aria-label=\"查看面\">\u003cbutton data-side=\"front\" title=\"切换查看面 · F\" class=\"active\" aria-pressed=\"true\">正面\u003c/button>\u003cbutton data-side=\"back\" title=\"切换查看面 · F\" aria-pressed=\"false\">背面\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"view-actions\">\u003cbutton id=\"zoom-out\" aria-label=\"缩小\">−\u003c/button>\u003coutput id=\"zoom-value\">100%\u003c/output>\u003cbutton id=\"zoom-in\" aria-label=\"放大\">＋\u003c/button>\u003cbutton id=\"fit\">显示全部\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"compact-inspector\" id=\"compact-inspector\">悬停孔位，查看两面连通关系\u003c/div>\n      \u003cdiv class=\"canvas\" id=\"canvas\">\n        \u003csvg id=\"board\" xmlns=\"http://www.w3.org/2000/svg\" tabindex=\"0\" role=\"application\" aria-label=\"洞洞板编辑画布，鼠标悬停查看网络，点击放置，Esc 取消\">\u003c/svg>\n        \u003cdiv class=\"edit-hint\" id=\"edit-hint\" hidden>\u003cspan id=\"edit-message\">\u003c/span>\u003cbutton id=\"cancel-edit\">取消 Esc\u003c/button>\u003c/div>\n        \u003cdiv class=\"canvas-note\">F 切面 · 焊锡再点直线调整 · Ctrl 多选 · 右拖平移\u003c/div>\n        \u003cdiv class=\"hover-tip\" id=\"hover-tip\" hidden>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"legend-pad\">\u003c/i>独立焊盘\u003c/span>\u003cspan>\u003ci class=\"legend-trace\">\u003c/i>灰色焊锡\u003c/span>\u003cspan>\u003ci class=\"legend-wire\">\u003c/i>正面红线\u003c/span>\u003cspan>\u003ci class=\"legend-back-wire\">\u003c/i>背面蓝线\u003c/span>\u003cspan>\u003ci class=\"legend-empty\">\u003c/i>网络内空孔\u003c/span>\u003cspan>\u003ci class=\"legend-used\">\u003c/i>网络内已插脚\u003c/span>\u003c/div>\n      \u003cfooter class=\"status-bar\">\u003cspan id=\"status\" role=\"status\">悬停任意孔位查看连通网络\u003c/span>\u003cspan id=\"scene-summary\">\u003c/span>\u003c/footer>\n    \u003c/section>\n    \u003c!-- 右栏整网与属性检查的是物理布局，不推断实际元件内部功能或电路是否可工作。 -->\n\u003caside class=\"panel right-panel\" aria-label=\"孔位、元件与网络信息\">\n      \u003csection>\u003cdiv class=\"section-heading\">\u003ch2>孔位与网络\u003c/h2>\u003cspan id=\"inspect-mode\">悬停查看\u003c/span>\u003c/div>\u003cdiv id=\"inspector\">\u003c/div>\u003cdiv id=\"selection-actions\" class=\"selection-actions\" hidden>\u003cbutton id=\"move-selected\">移动 M\u003c/button>\u003cbutton id=\"copy-selected\">复制 C\u003c/button>\u003cbutton id=\"delete-selected\">删除 Del\u003c/button>\u003cbutton id=\"rotate-group\" hidden>整组旋转 · 空格\u003c/button>\u003c/div>\u003cdiv id=\"property-form\" class=\"property-form\" hidden>\u003cstrong id=\"property-heading\">\u003c/strong>\u003clabel>名称\u003cinput id=\"property-name\" maxlength=\"120\">\u003c/label>\u003clabel id=\"property-value-label\">参数\u003cinput id=\"property-value\" maxlength=\"120\">\u003c/label>\u003clabel id=\"property-direction-label\">引出方向\u003cselect id=\"property-direction\">\u003coption value=\"left\">左\u003c/option>\u003coption value=\"up\">上\u003c/option>\u003coption value=\"right\">右\u003c/option>\u003coption value=\"down\">下\u003c/option>\u003c/select>\u003c/label>\u003clabel id=\"property-reverse-label\" class=\"check\">\u003cinput id=\"property-reverse\" type=\"checkbox\">交换二极管极性\u003c/label>\u003clabel id=\"property-side-label\">飞线所属面\u003cselect id=\"property-side\">\u003coption value=\"front\">正面（红）\u003c/option>\u003coption value=\"back\">背面（蓝）\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"property-custom\" class=\"two-fields\">\u003clabel>本体宽（孔距）\u003cinput id=\"property-width\" type=\"number\" min=\"1\" max=\"59\">\u003c/label>\u003clabel>本体高（孔距）\u003cinput id=\"property-height\" type=\"number\" min=\"1\" max=\"59\">\u003c/label>\u003c/div>\u003cp id=\"pin-tune-help\" class=\"detail-note\" hidden>\u003c/p>\u003cdiv id=\"property-pins\">\u003c/div>\u003cp class=\"detail-note\">文字按 Enter 或离开输入框提交；选项立即生效。脚号固定，脚名可重复。\u003c/p>\u003cdiv id=\"reconnect-actions\" class=\"selection-actions\">\u003cbutton id=\"reconnect-first\">重接第 1 脚\u003c/button>\u003cbutton id=\"reconnect-second\">重接第 2 脚\u003c/button>\u003c/div>\u003cbutton id=\"turn-selected\">换向 · 空格\u003c/button>\u003c/div>\u003c/section>\n      \u003csection class=\"separated connection-check\">\u003cdiv class=\"section-heading\">\u003ch2>连接检查\u003c/h2>\u003cspan>全板\u003c/span>\u003c/div>\u003cstrong id=\"validation-summary\">\u003c/strong>\u003cp id=\"validation-details\" class=\"detail-note\">\u003c/p>\u003c/section>\n      \u003csection class=\"separated\">\u003cdiv class=\"section-heading\">\u003ch2>双面连接\u003c/h2>\u003cspan>不是原理图\u003c/span>\u003c/div>\u003cdiv class=\"sample-guide\">\u003cspan class=\"side-tag\">正面\u003c/span>\u003cp>元件和固定红色飞线。\u003c/p>\u003cspan class=\"side-tag back-tag\">背面\u003c/span>\u003cp>固定灰色焊锡和固定蓝色飞线。焊锡共孔即导通，飞线仅两端导通，二者都不提供颜色修改。\u003c/p>\u003c/div>\u003cp class=\"detail-note\">\u003cbutton id=\"inspect-example\" class=\"inline-button\">查看示例网络\u003c/button>。修改后以当前电路的网络为准。\u003c/p>\u003c/section>\n      \u003csection class=\"separated\">\u003cdiv class=\"section-heading\">\u003ch2>孔号与连接规则\u003c/h2>\u003c/div>\u003cdiv class=\"example-id\">P1 : \u003cb>AD20\u003c/b>\u003c/div>\u003cp class=\"detail-note\">P1 是当前板；字母表示列，数字表示行。超过 Z 后使用 AA、AB…，翻板不会改变物理孔号。\u003c/p>\u003cul class=\"rule-list\">\u003cli>只有实体脚和飞线端点占孔。\u003c/li>\u003cli>焊锡不占孔；已有走线的空孔可插脚。\u003c/li>\u003cli>走线共孔导通，重叠部分合并。\u003c/li>\u003cli>飞线线身交叉不形成连接。\u003c/li>\u003c/ul>\u003c/section>\n    \u003c/aside>\n  \u003c/main>\n  \u003c!-- 模态区：先决定冲突/缩板再提交；图片镜像选项与设计视图独立。 -->\n\u003cdialog id=\"save-dialog\">\u003ch2>保存洞洞板项目\u003c/h2>\u003clabel>项目名称\u003cinput id=\"save-name\" maxlength=\"120\">\u003c/label>\u003clabel>保存方式\u003cselect id=\"save-method\">\u003coption value=\"download\">浏览器下载\u003c/option>\u003coption value=\"native\">系统选择位置（支持的浏览器）\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"detail-note\" id=\"save-help\">下载路径由浏览器设置决定。项目文件包含板型、元件、焊锡和双面设置。\u003c/p>\u003cp id=\"save-error\" role=\"status\">\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"save-cancel\">取消\u003c/button>\u003cbutton id=\"save-confirm\" class=\"primary\">保存\u003c/button>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"decision-dialog\" aria-labelledby=\"decision-title\" aria-describedby=\"decision-help\">\u003ch2 id=\"decision-title\">\u003c/h2>\u003cp id=\"decision-help\" class=\"detail-note\">\u003c/p>\u003cdiv id=\"decision-list\" class=\"decision-list\">\u003c/div>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"decision-cancel\">取消\u003c/button>\u003cbutton id=\"decision-fixed\">保留原位，删除移动冲突项\u003c/button>\u003cbutton id=\"decision-moving\" class=\"primary\">保留移动，删除原位冲突项\u003c/button>\u003c/div>\u003c/dialog>\n  \u003cdialog id=\"export-dialog\" aria-labelledby=\"export-title\">\u003ch2 id=\"export-title\">输出布局与连接\u003c/h2>\u003clabel>输出内容\u003cselect id=\"export-kind\">\u003coption value=\"image\">板子图片 PNG\u003c/option>\u003coption value=\"netlist\">连接网表\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"image-options\">\u003clabel>导出面\u003cselect id=\"export-side\">\u003coption value=\"both\">正反面（两张 PNG，打包 ZIP）\u003c/option>\u003coption value=\"front\">仅正面\u003c/option>\u003coption value=\"back\">仅背面\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"export-mirror\" type=\"checkbox\" checked>背面镜像，方便对照焊接\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"export-reference\" type=\"checkbox\" checked>淡显另一面（沿用当前强度）\u003c/label>\u003cp class=\"detail-note\">按当前方向输出完整板子，含孔号和元件编号；不受缩放、平移与选中高亮影响。背面输出默认镜像，设计视图保持原设置。\u003c/p>\u003c/div>\u003cdiv id=\"netlist-options\" hidden>\u003clabel>文件格式\u003cselect id=\"export-format\">\u003coption value=\"json\">JSON · 完整连接信息\u003c/option>\u003coption value=\"csv\">CSV · 逐脚检查表\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"detail-note\">包含各网络焊盘、元件脚、飞线所属面与焊锡连接。依据实体布局计算，便于逐脚核对。\u003c/p>\u003c/div>\u003cp id=\"export-state\" role=\"status\">\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"export-cancel\">取消\u003c/button>\u003cbutton id=\"export-confirm\" class=\"primary\">导出\u003c/button>\u003c/div>\u003c/dialog>\n  \u003c!-- 脚本依赖：model → editor → files → draft/export/demo → app；app 最后建工程并恢复草稿。 -->\n\u003cscript>\n/**\n * 模块：洞洞板物理孔、视口与完整连通图\n * 源文件：perfboard/dist/model.js；此说明会随离线打包保留。\n * 无 DOM；浏览器导出 PerfboardModel，Node 回归复用。物理尺寸以行列记录，PITCH/MARGIN 为绘图单位，不代表导出打印比例。\n * 实体脚/飞线端点占孔；背面焊锡仅连边不占孔。正反面共用孔 ID 与占孔表。图遍历不模拟元件内部导通。\n *\n * 重要变量与不变量：\n * - PITCH/MARGIN：物理孔到逻辑 SVG 坐标的比例与板边距；byId 为孔索引。neighbors/occupied/byHole 分别描述图边、实体占孔和所属网络。\n */\n(function(root){\n  'use strict';\n  const PITCH=18,MARGIN=40;\n  /** defaultView：返回全新的默认视图：正面、背面设计不镜像、另一面淡显 40%；pan 对象不跨调用共享。\n   */\n  function defaultView(){return {orientation:'horizontal',side:'front',mirror:false,reference:true,opacity:40,zoom:1,pan:{x:0,y:0}};}\n  /** imageView：派生独立图片视图，背面图片默认镜像；不能反写设计视图或改变物理孔位。\n   */\n  function imageView(view={}){const side=view.side??'front';return {orientation:view.orientation??'horizontal',side,mirror:side==='back',reference:view.reference??true,opacity:view.opacity??40};}\n  /** wireColor：从飞线物理所属面派生固定色：正面红、背面蓝；存档不需要用户颜色字段，焊锡另用灰色。\n   */\n  function wireColor(side){if(!['front','back'].includes(side))throw new Error('飞线所属面无效');return side==='front'?'#ff0000':'#0066cc';}\n  /** columnName：将从 1 开始的列号转换为 A…Z、AA… 的字母编码；使用减一的 26 进制，保证 Z/AA 边界正确。\n   */\n  function columnName(column){\n    if(!Number.isSafeInteger(column)||column\u003c1)throw new Error('列号必须为正整数');\n    let name='';for(let n=column;n;n=Math.floor((n-1)/26))name=String.fromCharCode(65+(n-1)%26)+name;return name;\n  }\n  /** key：根据物理列、行生成稳定孔号；只编码物理位置，不加入镜像或屏幕旋转。\n   */\n  const key=(column,row)=>`${columnName(column)}${row}`;\n  /** normalizeBoard：校验单板列数 10～40、行数 10～60 且均为 5 的倍数；返回只包含物理尺寸的配置。\n   */\n  function normalizeBoard(config={}){\n    const columns=config.columns??35,rows=config.rows??55;\n    if(!Number.isInteger(columns)||columns\u003c10||columns>40||columns%5)throw new Error('列数应为 10～40，步长为 5');\n    if(!Number.isInteger(rows)||rows\u003c10||rows>60||rows%5)throw new Error('行数应为 10～60，步长为 5');\n    return {columns,rows};\n  }\n  /** buildBoard：生成独立物理孔记录和 byId 索引，孔距为逻辑像素 PITCH；正反面共用同一组孔 ID，不复制两套占孔模型。\n   */\n  function buildBoard(config){\n    const {columns,rows}=normalizeBoard(config),holes=[],byId=new Map();\n    for(let row=1;row\u003c=rows;row++)for(let column=1;column\u003c=columns;column++){\n      const hole={id:key(column,row),column,row,x:MARGIN+(column-1)*PITCH,y:MARGIN+(row-1)*PITCH};holes.push(hole);byId.set(hole.id,hole);\n    }\n    return {columns,rows,holes,byId,pitch:PITCH,margin:MARGIN,width:2*MARGIN+(columns-1)*PITCH,height:2*MARGIN+(rows-1)*PITCH};\n  }\n  /** orientation：构建方向与背面镜像的仿射矩阵。\n   * 先按 orientation 选择旋转投影，再只在背面且 mirror=true 时翻转显示横轴；镜像改变矩阵，不改变工程坐标、孔号或网络。\n   */\n  function orientation(board,{orientation='horizontal',side='front',mirror=false}={}){\n    const horizontal=orientation==='horizontal',width=horizontal?board.height:board.width,height=horizontal?board.width:board.height;\n    let matrix=horizontal?{a:0,b:1,c:-1,d:0,e:board.height,f:0}:{a:1,b:0,c:0,d:1,e:0,f:0};\n    if(side==='back'&&mirror)matrix={...matrix,a:-matrix.a,c:-matrix.c,e:width-matrix.e};\n    return {width,height,matrix};\n  }\n  // The stored orientation describes the projection. Its aspect can change on resize.\n  /** layoutOrientation：依据投影后的实际宽高决定界面横/竖状态；方形无唯一长边，使用 layoutOrientation 保存上次选择。\n   */\n  function layoutOrientation(board,view={}){\n    const {width,height}=orientation(board,view);\n    return width===height?(view.layoutOrientation??view.orientation??'horizontal'):width>height?'horizontal':'vertical';\n  }\n  /** orientLayout：将用户点选的横/竖状态转换成投影方向；只有目标与当前实际宽高方向不符时才转 90°，方形仍可主动换向。\n   */\n  function orientLayout(board,view,target){\n    if(!['horizontal','vertical'].includes(target))throw new Error('显示方向无效');\n    const current=layoutOrientation(board,view),next={...view,layoutOrientation:target};\n    if(current!==target)next.orientation=(view.orientation??'horizontal')==='horizontal'?'vertical':'horizontal';\n    return next;\n  }\n  /** transform：应用二维仿射矩阵：x=a*x+c*y+e，y=b*x+d*y+f；物 e!=='undefined'&&module.exports?require('./model.js'):root.PerfboardModel;\n  const KINDS=new Set(['resistor','capacitor','diode','chip','transistor','custom','port']);\n  class LayoutError extends Error{\n    /** LayoutError 构造器：保留错误 code、message 与结构化 issues；UI 可按孔号/对象定位，调用方也可按 code 区分硬错误。\n     */\n    constructor(code,message,details={}){super(message);this.name='LayoutError';this.code=code;this.issues=[{code,message,...details}];}\n  }\n  /** fail：抛出带 code 和结构化详情的 LayoutError；由计划入口转换为 issues，禁止在失败后继续提交候选数据。\n   */\n  const fail=(code,message,details)=>{throw new LayoutError(code,message,details);};\n  /** text：验证或转换限定长度的文本字段；调用者决定默认值及具体业务含义。\n   */\n  function text(value,label,fallback=''){\n    const result=value??fallback;\n    if(typeof result!=='string'||result.length>120)fail('TEXT',`${label}应为不超过 120 字的文字`);\n    return result;\n  }\n  /** identifier：验证对象或物理脚稳定 ID 的字符和长度；显示名称可变，但身份字段不能在改名/移动时被替换。\n   */\n  function identifier(value,label){if(typeof value!=='string'||!/^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/.test(value))fail('IDENTIFIER',`${label}标识无效`);return value;}\n  /** hole：校验孔号属于当前物理板并返回孔记录；板外引用必须在生成候选前被拒绝。\n   */\n  function hole(board,id){if(typeof id!=='string'||!board.byId.has(id))fail('MISSING_HOLE',`孔 ${String(id)} 在板上不存在`,{holes:[String(id)]});return board.byId.get(id);}\n  /** quarter：只接受 0/90/180/270 度离散方向，避免自由角度旋转让实体脚脱离孔阵列。\n   */\n  function quarter(value=0){if(![0,90,180,270].includes(value))fail('ROTATION','方向应为 0、90、180 或 270 度');return value;}\n  /** rotatePoint：围绕局部原点执行四分之一圈整数旋转，供本体/引脚与整组变换共用，不引入浮点三角误差。\n   */\n  function rotatePoint(x,y,rotation=0){quarter(rotation);return rotation===90?{x:-y,y:x}:rotation===180?{x:-x,y:-y}:rotation===270?{x:y,y:-x}:{x,y};}\n  /** pointHole：将整数列行转换成孔号并验证范围；局部坐标旋转或平移后必须经过此检查。\n   */\n  function pointHole(board,c,r,label='脚位'){if(!Number.isInteger(c)||!Number.isInteger(r)||c\u003c1||c>board.columns||r\u003c1||r>board.rows)fail('MISSING_HOLE',`${label}超出板上范围`);return M.key(c,r);}\n  /** partAnchor：返回对象本体安装锚孔；自定义与微调三极管不能盲用第一脚，否则拖第一脚会意外带动本体。\n   */\n  function partAnchor(part){return part.kind==='custom'?M.key(part.body.column,part.body.row):part.kind==='transistor'&&part.anchor?M.key(part.anchor.column,part.anchor.row):part.pins[0].hole;}\n  /** normalizePart：校验并规范化单个元件的类型、引脚、参数及几何。返回新对象；孔位存在不等于可插入，跨对象实体占孔由整板验证继续检查。\n   */\n  function normalizePart(board,raw){\n    if(!raw||!KINDS.has(raw.kind))fail('PART_KIND','元件类型无效');\n    const id=identifier(raw.id,'元件'),kind=raw.kind;\n    if(!Array.isArray(raw.pins)||raw.pins.length\u003c1||raw.pins.length>40)fail('PIN_COUNT',`${id} 引脚数应为 1～40`);\n    const pins=raw.pins.map((pin,index)=>{\n      if(!pin||typeof pin!=='object')fail('PIN',`${id} 引脚数据无效`);\n      hole(board,pin.hole);const number=String(index+1),pinId=identifier(pin.id??number,`${id} 引脚`);\n      if(pin.number!==undefined&&pin.number!==number)fail('PIN_NUMBER',`${id} 物理脚号必须按 1 开始的顺序保存`);\n      return {id:pinId,number,name:text(pin.name,`${id} 脚名`,number),hole:pin.hole};\n    });\n    if(new Set(pins.map(p=>p.id)).size!==pins.length)fail('PIN_IDENTITY',`${id} 引脚标识重复`);\n    const fixed=kind==='port'?1:kind==='transistor'?3:['resistor','capacitor','diode'].includes(kind)?2:null;\n    if(fixed!==null&&pins.length!==fixed)fail('PIN_COUNT',`${id} 必须有 ${fixed} 个引脚`);\n    const part={id,kind,name:text(raw.name,`${id} 名称`,kind),value:text(raw.value,`${id} 参数`),pins};\n    const positions=pins.map(p=>hole(board,p.hole));\n    if(['resistor','capacitor','diode'].includes(kind)){\n      const [a,b]=positions;\n      if(Math.hypot(a.column-b.column,a.row-b.row)>10+1e-9)fail('PIN_SPAN',`${id} 两脚距离不能超过 10 个孔距`,{objectIds:[id],holes:pins.map(p=>p.hole)});\n      if(kind==='diode'){if(raw.reverse!==undefined&&typeof raw.reverse!=='boolean')fail('DIODE_DIRECTION',`${id} 二极管方向必须为布尔值`);part.reverse=raw.reverse??false;}\n    }\n    if(kind==='chip'){\n      const n=pins.length,half=n/2;\n      if(n\u003c4||n>20||n%2)fail('DIP_COUNT',`${id} 应为偶数脚 DIP-4～DIP-20`);\n      const a=positions[0],dx=positions[1].column-a.column,dy=positions[1].row-a.row;\n      if(Math.abs(dx)+Math.abs(dy)!==1)fail('DIP_GEOMETRY',`${id} 同排引脚必须相邻`);\n      for(let i=0;i\u003cn;i++){\n        const step=i\u003chalf?i:n-1-i,offset=i\u003chalf?0:3,p=positions[i];\n        if(p.column!==a.column+dx*step+dy*offset||p.row!==a.row+dy*step-dx*offset)fail('DIP_GEOMETRY',`${id} 脚号顺序或两排间距无效`,{objectIds:[id],holes:[pins[i].hole]});\n      }\n      part.rotation={'0,1':0,'-1,0':90,'0,-1':180,'1,0':270}[`${dx},${dy}`];\n      if(raw.rotation!==undefined&&quarter(raw.rotation)!==part.rotation)fail('DIP_GEOMETRY',`${id} 方向与物理脚位不一致`);\n    }\n    if(kind==='transistor'){\n      const [a,b,c]=positions,dx=b.column-a.column,dy=b.row-a.row;\n      const inferred={'1,0':0,'0,1':90,'-1,0':180,'0,-1':270}[`${dx},${dy}`];\n      if(!raw.anchor&&(inferred===undefined||c.column-b.column!==dx||c.row-b.row!==dy||raw.rotation!==undefined&&quarter(raw.rotation)!==inferred))fail('TRANSISTOR_GEOMETRY',`${id} 微调脚位需要保存本体锚点`);\n      part.rotation=quarter(raw.rotation??inferred);part.anchor=raw.anchor?{column:raw.anchor.column,row:raw.anchor.row}:{column:a.column,row:a.row};\n      pointHole(board,part.anchor.column,part.anchor.row,'三极管锚点');\n      for(let i=0;i\u003c3;i++){const local=rotatePoint(positions[i].column-part.anchor.column,positions[i].row-part.anchor.row,(360-part.rotation)%360);if(Math.abs(local.x-i)>1||Math.abs(local.y)>1)fail('TRANSISTOR_PIN_REACH',`${id} 第 ${i+1} 脚只能在默认脚位横纵各 ±1 孔内微调`,{holes:[pins[i].hole],objectIds:[id]});}\n    }\n    if(kind==='custom'){\n      const b=raw.body;\n      if(!b||!['column','row','width','height'].every(k=>Number.isInteger(b[k]))||b.width\u003c1||b.height\u003c1)fail('CUSTOM_BODY',`${id} 需要整数孔距的本体尺寸及位置`);\n      part.body={column:b.column,row:b.row,width:b.width,height:b.height};part.rotation=quarter(raw.rotation);\n      for(const [x,y]of [[0,0],[b.width,0],[0,b.height],[b.width,b.height]]){const p=rotatePoint(x,y,part.rotation);if(b.column+p.x\u003c1||b.column+p.x>board.columns||b.row+p.y\u003c1||b.row+p.y>board.rows)fail('CUSTOM_BODY',`${id} 本体超出板上孔位范围`);}\n      for(const p of positions){const local=rotatePoint(p.column-b.column,p.row-b.row,(360-part.rotation)%360);if(local.x\u003c -1||local.x>b.width+1||local.y\u003c -1||local.y>b.height+1)fail('CUSTOM_PIN_REACH',`${id} 引脚须在本体范围或周围一孔内`,{holes:[p.id],objectIds:[id]});}\n    }\n    if(kind==='port'){\n      part.direction=raw.direction??'left';\n      if(!['left','right','up','down'].includes(part.direction))fail('PORT_DIRECTION',`${id} 引出方向无效`);\n    }\n    return part;\n  }\n  /** normalizeWire：校验飞线位号、面别和两个不同端点；颜色由面别派生，线身交叉不产生节点。\n   */\n  function normalizeWire(board,raw){\n    if(!raw||typeof raw!=='object')fail('WIRE','飞线数据无效');\n    const id=identifier(raw.id,'飞线');\n    if(!['front','back'].includes(raw.side))fail('WIRE_SIDE',`${id} 必须指定正面或背面`);\n    if(!Array.isArray(raw.pins)||raw.pins.length!==2)fail('WIRE_PINS',`${id} 必须有两个端点`);\n    raw.pins.forEach(id=>hole(board,id));\n    if(raw.pins[0]===raw.pins[1])fail('WIRE_SAME_HOLE',`${id} 两端不能使用同一孔`,{objectIds:[id],holes:[raw.pins[0]]});\n    const color=M.wireColor(raw.side);\n    return {id,name:text(raw.name,`${id} 名称`,'飞线'),side:raw.side,color,pins:[...raw.pins]};\n  }\n  /** normalizeEdges：验证每条焊锡边连接板内相邻孔，以排序端点键去重并稳定排序；存实际焊锡形状，不存历史绘制笔次。\n   */\n  function normalizeEdges(board,edges){\n    if(!Array.isArray(edges)||edges.length>20000)fail('TRACE_EDGES','焊接边列表无效或过大');\n    const unique=new Map();\n    for(const edge of edges){\n      if(!Array.isArray(edge)||edge.length!==2)fail('TRACE_EDGE','焊接边必须有两个相邻焊盘');\n      const [a,b]=edge,p=hole(board,a),q=hole(board,b);\n      if(Math.abs(p.column-q.column)+Math.abs(p.row-q.row)!==1)fail('TRACE_EDGE',`焊接边 ${a}—${b} 必须沿相邻焊盘连接`,{holes:[a,b]});\n      const k=M.edgeKey(a,b);unique.set(k,a\u003cb?[a,b]:[b,a]);\n    }\n    return [...unique.entries()].sort(([a],[b])=>a.localeCompare(b,'en')).map(([,edge])=>edge);\n  }\n  /** freeze：递归冻结纯布局数据，阻止 UI 预览就地改写已提交 parts/wires/edges；派生索引另行构造。\n   */\n  function freeze(value){if(value&&typeof value==='object'&&!Object.isFrozen(value)){Object.values(value).forEach(freeze);Object.freeze(value);}return value;}\n  /** createProject：完整验证板型、对象上限、位号、引脚及双面实体占孔，冻结 data 后重建连接和摘要。\n   * 成功返回 {board,data,connections,summary}；布局允许按设计将同元件多脚连接，不做电路功能/短路合理性判断。\n   */\n  function createProject(config,raw={}){\n    const board=config?.byId instanceof Map?config:M.buildBoard(config);\n    if(!raw||typeof raw!=='object'||Array.isArray(raw))fail('PROJECT_DATA','电路数据必须为对象');\n    const source={parts:raw.parts??[],wires:raw.wires??[],edges:raw.edges??[]};\n    if(!Array.isArray(source.parts)||!Array.isArray(source.wires)||source.parts.length+source.wires.length>500)fail('OBJECT_LIMIT','项目最多支持 500 个元件和飞线对象');\n    const parts=source.parts.map(p=>normalizePart(board,p)),wires=source.wires.map(w=>normalizeWire(board,w)),edges=normalizeEdges(board,source.edges),ids=new Set(),occupants=new Map(),issues=[];\n    for(const object of [...parts,...wires]){\n      if(ids.has(object.id))fail('DUPLICATE_ID',`标识 ${object.id} 重复`);ids.add(object.id);\n      const pins=parts.includes(object)?object.pins.map(p=>p.hole):object.pins;\n      for(const id of pins){if(occupants.has(id))issues.push({code:'OCCUPIED_HOLE',message:`孔 ${id} 已有实体脚，不能再次插入`,holes:[id],objectIds:[occupants.get(id),object.id]});else occupants.set(id,object.id);}\n    }\n    if(issues.length){const error=new LayoutError(issues[0].code,issues[0].message);error.issues=issues;throw error;}\n    // Deliberate connections between component pins are valid layout data.\n    const data=freeze({parts,wires,edges}),connections=M.connectivity(board,data);\n    const summary={parts:parts.length,wires:wires.length,occupiedHoles:connections.occupied.size,solderEdges:edges.length,activeNetworks:connections.networks.filter(n=>n.terminals.length||n.edges.length).length};\n    return {board,data,connections,summary};\n  }\n  /** problem：把规则异常转换成统一的 {ok:false,changed:false,issues} 结果，供 UI 展示错误孔/对象而不改当前电路。\n   */\n  function problem(error){return {ok:false,changed:false,issues:error.issues??[{code:'INVALID_LAYOUT',message:error.message}]};}\n  /** inspectProject：以结果对象包装完整工程验证；适用于需要显示结构化 issues 而非直接抛错的调用。\n   */\n  function inspectProject(config,raw){try{return {ok:true,issues:[],project:createProject(config,raw)};}catch(error){return problem(error);}}\n  /** plan：所有局部编辑的非破坏性计划入口。makeData 生成候选，再完整 createProject 校验；相同 data 返回原工程和 changed=false。\n   * before 保存源 data 身份供提交时检查；失败结果带 candidate 便于红色预览，但绝不能提交它。\n   */\n  function plan(project,makeData){\n    let candidate;\n    try{\n      candidate=makeData();const next=createProject(project.board,candidate),changed=JSON.stringify(project.data)!==JSON.stringify(next.data);\n      return {ok:true,changed,issues:[],before:project.data,project:changed?next:project};\n    }catch(error){return {...problem(error),candidate};}\n  }\n  /** planTrace：规划新增/删除焊锡折线，展开成实际相邻边后合并或按键删除；重复走线最终只有一份，不因实体脚而拒绝。\n   */\n  function planTrace(project,points,{remove=false}={}){\n    return plan(project,()=>{\n      if(!Array.isArray(points)||points.length\u003c2||points.length>100)fail('TRACE_PATH','走线需要 2～100 个板内路径点');\n      points.forEach(id=>hole(project.board,id));\n      let edges;try{edges=M.traceEdges(project.board,points);}catch(error){fail('TRACE_PATH',error.message);}\n      if(!remove)return {...project.data,edges:[...project.data.edges,...edges]};\n      const removed=new Set(edges.map(([a,b])=>M.edgeKey(a,b)));return {...project.data,edges:project.data.edges.filter(([a,b])=>!removed.has(M.edgeKey(a,b)))};\n    });\n  }\n  /** planPart：规划新增或替换元件，保护稳定对象/引脚 ID 及已放置 DIP 的脚数；经整板验证后才可供提交。\n   */\n  function planPart(project,raw,{replaceId=null}={}){\n    return plan(project,()=>{\n      if(!raw||typeof raw!=='object')fail('PART_KIND','元件数据无效');\n      const existing=replaceId?project.data.parts.find(p=>p.id===replaceId):null;\n      if(replaceId&&!existing)fail('MISSING_OBJECT',`元件 ${replaceId} 不存在`);\n      if(existing&&raw.id!==existing.id)fail('IDENTIFIER','修改元件不能改变稳定标识');\n      if(existing?.kind==='chip'&&(raw.kind!=='chip'||raw.pins?.length!==existing.pins.length))fail('DIP_COUNT','已放置芯片不能直接修改封装脚数');\n      if(existing&&raw.pins?.length===existing.pins.length)raw.pins.forEach((p,i)=>{if((p.id??String(i+1))!==existing.pins[i].id)fail('PIN_IDENTITY','改名或移动不能改变物理引脚身份');});\n      return {...project.data,parts:existing?project.data.parts.map(p=>p.id===replaceId?raw:p):[...project.data.parts,raw]};\n    });\n  }\n  /** planWire：规划新增或替换飞线。替换时先移除旧端点再检查占孔，因此自身原孔可复用；已有焊锡不算实体占用。\n   */\n  function planWire(project,raw,{replaceId=null}={}){\n    return plan(project,()=>{\n      const wire=normalizeWire(project.board,raw),existing=replaceId?project.data.wires.find(w=>w.id===replaceId):null;\n      if(replaceId&&!existing)fail('MISSING_OBJECT',`飞线 ${replaceId} 不存在`);\n      if(existing&&wire.id!==existing.id)fail('IDENTIFIER','修改飞线不能改变稳定标识');\n      const wires=project.data.wires.filter(w=>w.id!==replaceId),base=M.connectivity(project.board,{...project.data,wires});\n      for(const id of wire.pins)if(base.occupied.has(id))fail('OCCUPIED_HOLE',`孔 ${id} 已有实体脚，不能再次插入`,{objectIds:[base.occupied.get(id).id??base.occupied.get(id).part,wire.id],holes:[id]});\n      return {...project.data,wires:existing?project.data.wires.map(w=>w.id===replaceId?wire:w):[...wires,wire]};\n    });\n  }\n  /** planRemove：按整件 ID 和实际焊锡边键规划删除；禁止引用不存在的元件/飞线，删导体后由新工程自动拆分网络。\n   */\n  function planRemove(project,{partIds=[],wireIds=[],edges=[]}={}){\n    return plan(project,()=>{\n      if(!Array.isArray(partIds)||!Array.isArray(wireIds))fail('REMOVE_OBJECTS','删除对象列表无效');\n      const removed=new Set(normalizeEdges(project.board,edges).map(([a,b])=>M.edgeKey(a,b)));\n      for(const id of partIds)if(!project.data.parts.some(p=>p.id===id))fail('MISSING_OBJECT',`元件 ${id} 不存在`);\n      for(const id of wireIds)if(!project.data.wires.some(w=>w.id===id))fail('MISSING_OBJECT',`飞线 ${id} 不存在`);\n      return {...proj dow.PerfboardFiles,D=window.PerfboardDemo,A=window.PerfboardDraft,X=window.PerfboardExport,$=id=>document.getElementById(id),svg=$('board'),canvas=$('canvas'),NS='http://www.w3.org/2000/svg';\n  const state={columns:35,rows:55,...M.defaultView()},names={resistor:'电阻',capacitor:'电容',diode:'二极管',transistor:'三极管',custom:'自定义',port:'引出线',chip:'芯片',wire:'飞线',trace:'焊锡走线',move:'移动',copy:'复制',reconnect:'重接端点',tune:'引脚微调',slide:'焊锡直线段调整',resize:'板型框预览'},twoPin=['resistor','capacitor','diode'],oneClick=['chip','transistor','custom','port'];\n  let project,history,board,data,connections,frame,scene,geometry,previewLayer,endpointLayer,selection=null,selectedPin=null,operation=null,cursorHole=null,hover={hole:null,part:null,line:null};\n  let projectName='双面连接示例',fileHandle=null,savedSignature='',sampleAnchor=null,busy=false,drag=null,scheduled=false,lastNetwork=null,lastOrigin=null,suppressClick=false,decision=null;\n  let holeNodes=new Map(),edgeNodes=new Map(),wireNodes=new Map(),partNodes=new Map(),partLabels=new Map(),pinNodes=new Map(),propertyKey=null,pinInputs=[],resizeLabels;\n  // Restore a square board's remembered layout when a resize is undone.\n  const boardLayouts=new WeakMap();\n  let draftStore=null,draftReady=false,draftIssue=null,draftTimer=null,lastDraftFingerprint='';\n  let switchSaveResolve=null;\n  /** finishSwitchSave：结束父页面等待中的保存请求，取走并清空一次性 resolve；成功、取消和失败都必须结束等待，避免切换状态永久锁住。\n   */\n  function finishSwitchSave(saved){const resolve=switchSaveResolve;switchSaveResolve=null;resolve?.(saved);}\n  /** discardSession：用户明确放弃后清除本页观察到的草稿，停掉定时写入并关闭草稿刷新；将当前签名设为干净，防止卸载时又把已放弃的数据写回。\n   */\n  function discardSession(){draftStore?.clear();clearTimeout(draftTimer);draftTimer=null;draftReady=false;savedSignature=signature();}\n  /** draftPayload：序列化已提交 project；尺寸预览期间使用 beforeView，避免把暂时改变的适配视图写进恢复草稿。\n   */\n  function draftPayload(){return F.projectData(project,operation?.tool==='resize'?{...state,...operation.beforeView}:state,projectName);}\n  /** getDraftStore：懒创建本工具独立的草稿存储适配器；存储访问异常转成可显示的 unavailable 错误，不阻断编辑。\n   */\n  function getDraftStore(){try{return draftStore??(draftStore=A.createStore(window.localStorage));}catch{throw Object.assign(new Error('浏览器不允许使用本地草稿'),{code:'unavailable'});}}\n  /** draftTime：把草稿时间转换为中文本地时间，仅用于界面显示，不参与工程比较。\n   */\n  function draftTime(value){return new Date(value).toLocaleString('zh-CN',{hour12:false});}\n  /** showDraftIssue：记录草稿错误、暂停正常自动写入并显示重试或接管入口；保留当前内存电路供用户另存文件。\n   */\n  function showDraftIssue(error){draftIssue=error;$('draft-state').textContent=`${error.message}；请保存项目文件保留本页。`;$('draft-panel').setAttribute('data-issue','');$('draft-retry').hidden=false;$('draft-retry').textContent=error.code==='invalid'?'重新建立草稿':error.code==='conflict'?'接管草稿写入':'重试草稿';}\n  /** queueDraft：将草稿写入防抖至最后一次变更后 450 ms；未初始化或存在草稿错误时不调度。\n   */\n  function queueDraft(){if(!draftReady||draftIssue)return;if(draftTimer!==null)clearTimeout(draftTimer);draftTimer=setTimeout(()=>flushDraft(),450);}\n  /** flushDraft：立即写入已提交工程；相同内容指纹不重复写，force 用于明确接管。先清定时器，再处理存储错误，候选预览不应进入缓存。\n   */\n  function flushDraft(force=false,retry=false){\n    if(draftTimer!==null){clearTimeout(draftTimer);draftTimer=null;}if(!draftReady||draftIssue&&!force&&!retry)return;\n    try{const payload=draftPayload(),fingerprint=JSON.stringify({project:payload,unexported:dirty()});if(!force&&!retry&&fingerprint===lastDraftFingerprint)return;const savedAt=getDraftStore().save(payload,dirty(),{force});lastDraftFingerprint=fingerprint;draftIssue=null;$('draft-state').textContent=`草稿已保存 ${draftTime(savedAt)}`;$('draft-panel').removeAttribute('data-issue');$('draft-retry').hidden=true;}catch(error){showDraftIssue(error);}\n  }\n  /** initializeDraft：启动时验证并恢复本工具草稿及查看设置；不恢复预览、选择、撤销和文件句柄。损坏缓存保留原文，失败后仍允许手工编辑。\n   */\n  function initializeDraft(){\n    try{const saved=getDraftStore().load();if(saved){projectName=saved.name;fileHandle=null;operation=null;sampleAnchor=null;delete state.layoutOrientation;Object.assign(state,saved.view);history.reset(saved.project);project=history.current;board=project.board;data=project.data;savedSignature=saved.unexported?'':signature();useProject(project);$('draft-state').textContent=`已恢复 ${draftTime(saved.savedAt)} 的草稿`;notice('已恢复本地草稿；未完成的预览与撤销记录不恢复，可保存项目作备份');}else $('draft-state').textContent='草稿就绪，完成编辑后自动保存。';}catch(error){showDraftIssue(error);}\n    lastDraftFingerprint=JSON.stringify({project:draftPayload(),unexported:dirty()});draftReady=true;\n  }\n\n  /** el：创建 SVG 命名空间节点，设置属性与 textContent，并在给定父节点存在时挂载；文本不作为 HTML 解析。\n   */\n  function el(tag,attrs={},parent=svg,text){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}\n  /** dom：创建普通 HTML 元素、类名和文本；属性表单与状态说明都不使用项目文本拼接 HTML。\n   */\n  function dom(tag,className,parent,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}\n  /** pos：按物理孔号返回当前板的孔坐标记录；坐标仍未经过显示旋转/镜像。\n   */\n  /* path：将物理点数组转成 SVG 折线路径数据；绘图路径本身不作为导通关系来源。 */\n  const pos=id=>board.byId.get(id),path=points=>'M'+points.map(p=>`${p.x},${p.y}`).join('L');\n  /** size：读取当前画布宽高，供适配、缩放锚点和鼠标边界校验共用。\n   */\n  function size(){const r=canvas.getBoundingClientRect();return {width:r.width,height:r.height};}\n  /** viewSettings：组合查看状态与本次适配范围/引出标注留白，提供给模型视口计算。\n   */\n  function viewSettings(){return operation?.tool==='resize'?{...state,fitBounds:operation.fitBounds}:state;}\n  /** local：把 client 鼠标坐标转换成画布局部坐标，投影/逆投影统一从此坐标域出发。\n   */\n  function local(event){const r=canvas.getBoundingClientRect();return {x:event.clientX-r.left,y:event.clientY-r.top};}\n  /** signature：序列化工程名称和已提交布局作为保存签名；不把仅影响查看的缩放、平移等算成工程修改。\n   */\n  function signature(){return JSON.stringify({name:projectName,board:{columns:board.columns,rows:board.rows},...data});}\n  /** dirty：将当前已提交布局签名与最后保存签名比较；视图切换本身不产生未保存工程修改。\n   */\n  function dirty(){return savedSignature!==signature();}\n  /** notice：
